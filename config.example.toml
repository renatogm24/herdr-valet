# herdr-valet — ~/.config/herdr-valet/config.toml
# Every key is optional; without them the defaults below apply.

# Days idle before the timer parks a session on its own.
# idle_days = 3

# How to resume, in the card's directory: in a new tab of the project's workspace if one is open.
# {session_id}, {cwd}, {model} and {profile} are substituted, already shell-quoted. If the session belonged
# to another account (CLAUDE_CONFIG_DIR), that is prepended automatically.
# Examples: "claude --resume {session_id} --model {model}", or your own launcher that sets
# secrets or flags: "my-launcher resume {session_id}".
# resume_command = "claude --resume {session_id}"

# Model that writes each card's summary (claude -p --model ...).
# summary_model = "haiku"

# How Claude is invoked for the summary. {session_id} is substituted; the `-p --model ...` flags
# are appended. A wrapper can route the summary through the same account or proxy the session
# used (it must end in `exec claude "$@"`).
# summary_command = "claude"

# Page port (127.0.0.1). Default 8790 + (uid - 1000): one per user.
# port = 8790

# Where cards live.
# data_dir = "~/.local/share/herdr-valet"

# Profiles: the ways you launch Claude (accounts, a proxy, wrappers). profile_command prints the
# one a session runs with ({session_id} substituted); profiles lists the ones the page offers to
# resume or switch to, "name" or "name:Label". resume_command gets the choice as {profile}.
# profile_command = "my-launcher which {session_id}"
# profiles = "work:Work API,personal:Subscription"
# resume_command = "my-launcher resume --as {profile} {session_id}"

# Context window the gauge measures against, per model ("model:tokens", comma-separated; a model
# requested as "...[1m]" counts as 1M). Other models use context_window, and a session seen above
# it counts as 1M.
# context_windows = "claude-opus-5-5:1000000"
# context_window = 200000

# Alerts on open sessions, each a reason to continue in a fresh one: context in tokens (the page's
# context gauge fills up to it), compactions, and what the next message costs once the cache is cold.
# alert_context_tokens = 300000
# alert_compactions = 3
# alert_cold_usd = 2.0

# `continue` and `fresh`: how the new session starts, in a new tab of the old one's workspace and
# directory. {prompt}, {model} (as the old session requested it, "[1m]" included), {cwd}, {handoff},
# {session_id} and {profile} (the old session's) are substituted, already shell-quoted. If
# resume_command goes through a launcher of yours (an account, MCP secrets), point this at it too, or
# the new session starts without them:
# "my-launcher new --as {profile} --model {model} {session_id} {prompt}".
# continue_prompt is the first message of `continue`, fresh_prompt that of `fresh` ({handoff} = the
# file's path).
# continue_command = "claude --model {model} {prompt}"
# continue_prompt = "Continue the work handed over in {handoff}: read it first, then carry on from where it leaves off."
# fresh_prompt = "Pick up the work of an earlier session from {handoff}: read it first, say in a few lines where things stand and what the next step is, then wait for the user."

# `relaunch` (and the hook, `valet.py hook`): a message that looks like new work is stopped once the
# session is past this many tokens. Provisional. relaunch_prompt is the new session's first message
# when "relaunch:" came with a request ({handoff} = handoff or context file, {request} = the request).
# relaunch_context_tokens = 200000
# relaunch_prompt = "Read {handoff} first: it is what an earlier session left for this. Then, the user's request: {request}"
# The handoff a relaunch asks for follows this template (the handoff skill's); "" or a missing file
# falls back to a short list of what to cover.
# handoff_template = "~/.claude/skills/handoff/templates/handoff.md"

# `fork`: how a copy of an open conversation starts, in a new tab next to it. Same placeholders as
# resume_command; {model} is the one the session requested. A launcher of yours must pass
# --fork-session on to claude.
# fork_command = "claude --resume {session_id} --fork-session --model {model}"

# Sessions closed by hand get a card (with summary and Resume) that goes away after this many days.
# closed_keep_days = 7

# `sync`, run by the timer before parking: POST new conversation entries, cards and recaps as JSON
# to a webhook you control. Empty sync_url = off. The Bearer token goes in sync_token_file
# (chmod 600), not here. Tabs named sync_knowledge_prefix… also send tool calls and results.
# sync_url = "http://192.168.1.10:3121/ingest"
# sync_token_file = "~/.config/herdr-valet/sync-token"
# sync_host = "<short hostname>"
# sync_knowledge_prefix = "knowledge-"
# sync_backfill_days = 7

# `feed`, run by the timer after sync: what changes in YOUR Jira issues (assigned, reported, watched) and
# GitHub PRs (yours and the reviews asked of you), to the same sync_url. Read-only on both sides. Each source
# is off while its key is empty. GitHub goes through `gh`, as the account it is logged in with.
# feed_github_login = "your-github-login"
# gh_command = "gh"
# Jira Cloud, read-only API token (Basic email:token). Classic token: "https://<site>.atlassian.net";
# scoped token: "https://api.atlassian.com/ex/jira/<cloudId>" (cloudId: https://<site>.atlassian.net/_edge/tenant_info).
# feed_jira_api = "https://api.atlassian.com/ex/jira/<cloudId>"
# feed_jira_site = "https://<site>.atlassian.net"
# feed_jira_email = "you@example.com"
# feed_jira_token_file = "~/.config/herdr-valet/jira-token"
# feed_jira_token_expires = "YYYY-MM-DD"   # 3 days before, feed sends a "renew the token" note
# feed_backfill_days = 7
# feed_every_min = 10   # auto runs every 10 min; ask Jira and GitHub at most this often (e.g. 30)
