# herdr-valet — ~/.config/herdr-valet/config.toml
# Every key is optional; without them the defaults below apply.

# Days idle before the timer parks a session on its own.
# idle_days = 3

# How to resume, in the card's directory: in a new tab of the project's workspace if one is open.
# {session_id}, {cwd}, {model} and {profile} are substituted, already shell-quoted. If the session belonged
# to another account (CLAUDE_CONFIG_DIR), that is prepended automatically.
# Examples: "claude --resume {session_id} --model {model}", or your own launcher that sets
# secrets or flags: "my-launcher resume {session_id}".
# resume_command = "claude --resume {session_id}"

# Model that writes each card's summary (claude -p --model ...).
# summary_model = "haiku"

# How Claude is invoked for the summary. {session_id} is substituted; the `-p --model ...` flags
# are appended. A wrapper can route the summary through the same account or proxy the session
# used (it must end in `exec claude "$@"`).
# summary_command = "claude"

# Page port (127.0.0.1). Default 8790 + (uid - 1000): one per user.
# port = 8790

# Where cards live.
# data_dir = "~/.local/share/herdr-valet"

# Profiles: the ways you launch Claude (accounts, a proxy, wrappers). profile_command prints the
# one a session runs with ({session_id} substituted); profiles lists the ones the page offers to
# resume or switch to, "name" or "name:Label". resume_command gets the choice as {profile}.
# profile_command = "my-launcher which {session_id}"
# profiles = "work:Work API,personal:Subscription"
# resume_command = "my-launcher resume --as {profile} {session_id}"

# Context window the gauge measures against, per model ("model:tokens", comma-separated; a model
# requested as "...[1m]" counts as 1M). Other models use context_window, and a session seen above
# it counts as 1M.
# context_windows = "claude-opus-5-5:1000000"
# context_window = 200000

# Alerts on sessions: context use (%), compactions, estimated cost in USD (list prices).
# alert_context_pct = 80
# alert_compactions = 3
# alert_cost_usd = 25

# `continue`: how the fresh session starts, in a new tab of the old one's workspace and directory.
# {prompt}, {model} (as the old session requested it, "[1m]" included), {cwd} and {handoff} are
# substituted, already shell-quoted. continue_prompt is its first message ({handoff} = the file's path).
# continue_command = "claude --model {model} {prompt}"
# continue_prompt = "Continue the work handed over in {handoff}: read it first, then carry on from where it leaves off."

# Sessions closed by hand get a card (with summary and Resume) that goes away after this many days.
# closed_keep_days = 7

# `sync`, run by the timer before parking: POST new conversation entries, cards and recaps as JSON
# to a webhook you control. Empty sync_url = off. The Bearer token goes in sync_token_file
# (chmod 600), not here. Tabs named sync_knowledge_prefix… also send tool calls and results.
# sync_url = "http://192.168.1.10:3121/ingest"
# sync_token_file = "~/.config/herdr-valet/sync-token"
# sync_host = "<short hostname>"
# sync_knowledge_prefix = "knowledge-"
# sync_backfill_days = 7
