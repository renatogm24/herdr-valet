<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>herdr-valet</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181d'/%3E%3Cpath d='M9 6v20M23 6v8a6 6 0 0 1-6 6H9' stroke='%23e4572e' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='20' r='3.4' fill='%23f4f1ea'/%3E%3C/svg%3E">
<style>
  /* World: enamel station signage + the schematic line map. Each project is a line with its own
     color; each parked session is a stop on it. One system sans, tabular numerals, an 8px grid.
     No external requests: the page runs on 127.0.0.1, sometimes offline. */
  :root {
    --u: 8px;
    --ground: #f2efe8; --panel: #fffdf8; --raised: #ebe7de; --rule: #d8d2c6; --rule-strong: #b9b2a4;
    --ink: #16181d; --body: #3a3d44; --muted: #63666e; --faint: #8d9098;
    --accent: #1d3fb8; --accent-ink: #ffffff; --accent-soft: #e3e8fa;
    --ok: #1f7a55; --warn: #8a5100; --warn-soft: #fbefd9; --bad: #b42318; --bad-soft: #fbe4e1;
    --focus: #1d3fb8;
    --shadow: 0 1px 2px rgb(22 24 29 / 0.06), 0 4px 16px rgb(22 24 29 / 0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111317; --panel: #181b20; --raised: #20242a; --rule: #2b3038; --rule-strong: #3d434d;
      --ink: #ece8df; --body: #c9c5bc; --muted: #959aa2; --faint: #6c7079;
      --accent: #8aa6ff; --accent-ink: #0d1430; --accent-soft: #1d2647;
      --ok: #5cc795; --warn: #f0b45a; --warn-soft: #2e2413; --bad: #ff8a7a; --bad-soft: #35191a;
      --focus: #8aa6ff;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px rgb(0 0 0 / 0.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--ground); }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink); background: var(--ground); font-variant-numeric: tabular-nums; min-height: 100vh; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  * { scrollbar-color: var(--rule-strong) transparent; scrollbar-width: thin; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.82em; }

  /* ------------------------------------------------------------------ top bar */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--ground); }
  .bar-in { max-width: 1240px; margin: 0 auto; padding: calc(var(--u) * 1.5) calc(var(--u) * 3);
    display: flex; align-items: center; gap: calc(var(--u) * 2); }
  .mark { display: flex; align-items: center; gap: var(--u); font-weight: 700; letter-spacing: -0.01em; font-size: 1.05rem; white-space: nowrap; }
  .mark svg { flex: none; }
  .who { font-size: 0.78rem; font-weight: 600; opacity: 0.6; }
  .search { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
  .search input { width: 100%; font: inherit; font-size: 0.9rem; color: inherit; background: rgb(255 255 255 / 0.08);
    border: 1px solid rgb(255 255 255 / 0.18); border-radius: 6px; padding: 6px 30px 6px 34px; }
  .search input::placeholder { color: inherit; opacity: 0.6; }
  .search input:focus { outline: none; border-color: currentColor; background: rgb(255 255 255 / 0.12); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.7; }
  .search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 600 0.7rem ui-monospace, monospace;
    border: 1px solid rgb(255 255 255 / 0.3); border-radius: 4px; padding: 0 5px; opacity: 0.7; }
  .counts { display: flex; gap: calc(var(--u) * 2); font-size: 0.82rem; white-space: nowrap; }
  .counts b { font-weight: 700; }
  .counts span { opacity: 0.75; }
  .herdr { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; opacity: 0.85; white-space: nowrap; }
  .herdr i { width: 8px; height: 8px; border-radius: 50%; background: #5cc795; }
  .herdr.down i { background: #ff8a7a; }
  @media (prefers-color-scheme: dark) { .bar { background: #07080a; color: var(--ink); } }

  /* ------------------------------------------------------------------ page */
  .page { max-width: 1240px; margin: 0 auto; padding: calc(var(--u) * 3); display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
  .banner { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: 8px; padding: calc(var(--u) * 1.5) calc(var(--u) * 2); font-size: 0.9rem; }
  .sect { display: flex; align-items: baseline; gap: var(--u); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: calc(var(--u) * 1.5); }
  .sect .n { color: var(--ink); }
  .sect-row { display: flex; align-items: baseline; gap: var(--u); flex-wrap: wrap; }
  .sect-row .sect { margin-right: auto; }
  .sect-row .note { flex-basis: 100%; margin: calc(var(--u) * -0.5) 0 calc(var(--u) * 1.5); }
  .sect-row .note:empty { display: none; }

  /* platform: open now — two lines per session: who and its state; how full, what it cost and
     what to do. One line never fits the actions next to the stats, and squeezed it overlapped. */
  .platform { display: flex; flex-direction: column; gap: 6px; }
  .open { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--line); border-radius: 8px; min-width: 0; }
  .open-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px calc(var(--u) * 1.5);
    padding: 8px 8px 8px 12px; }
  .open-row > .pf { grid-column: 1; }
  .open .who-s { grid-column: 2; display: flex; align-items: baseline; gap: var(--u); min-width: 0; overflow: hidden; }
  .open .st { grid-column: 3; }
  .open .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px calc(var(--u) * 1.5); }
  /* The place gives way after the title, and both end in "…" instead of running into the state. */
  .open .place { font-weight: 700; font-size: 0.9rem; white-space: nowrap; flex: 0 1 auto; min-width: 0; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; }
  .open .place .tb { color: var(--body); font-weight: 600; }
  .open .place .sep { color: var(--faint); font-weight: 400; margin: 0 2px; }
  .open .nm { color: var(--body); font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 4 auto; }
  .open .st { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .open .st.working { color: var(--ok); font-weight: 600; }
  .open .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; margin-left: auto; }
  .open .note { font-size: 0.78rem; padding: 0 12px 8px; }
  /* An alert is a reason to continue in a fresh session: said in words, with the action next to
     it, on a band of its own. Never a hue on the border, which the project stripe already uses. */
  .open .alertbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px calc(var(--u) * 1.5); padding: 6px 8px 6px 12px;
    background: var(--warn-soft); color: var(--warn); font-size: 0.8rem; font-weight: 600; border-radius: 0 0 7px 0;
    border-top: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .open .alertbar .why { flex: 1 1 auto; min-width: 0; }
  .open .alertbar .why::before { content: "⚠"; margin-right: 6px; }
  /* Rare actions wait behind "⋯": a row shows at most one action of its own. */
  .more { position: relative; }
  .more > summary { list-style: none; }
  .more > summary::-webkit-details-marker { display: none; }
  .more[open] > summary { background: var(--raised); }
  .more .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 230px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 4px; box-shadow: var(--shadow); }
  .more .menu button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 1px;
    padding: 6px 10px; border-radius: 5px; font-size: 0.84rem; font-weight: 600; color: var(--ink); }
  .more .menu button small { font-size: 0.74rem; font-weight: 400; color: var(--muted); }
  .more .menu button:hover, .more .menu button:focus-visible { background: var(--raised); }
  .more .menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .more .menu button.armed { background: var(--warn-soft); color: var(--warn); }
  .more .menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 2px; }
  .open .note:empty { display: none; }
  .open .recap { border-top: 1px solid var(--rule); padding: calc(var(--u) * 1.5) 12px; }
  .open .relaunch { border-top: 1px solid var(--rule); padding: calc(var(--u) * 1.5) 12px; display: flex; flex-direction: column; gap: var(--u); font-size: 0.84rem; }
  .relaunch .rl-head { color: var(--muted); }
  .relaunch .rl-opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .relaunch .rl-opt input { margin-top: 3px; accent-color: var(--accent); }
  .relaunch .rl-opt.off { opacity: 0.55; cursor: default; }
  .relaunch .rl-opt small { display: block; color: var(--muted); font-size: 0.78rem; }
  .relaunch .rl-cost { color: var(--body); }
  .relaunch .rl-rec { font-size: 0.72rem; font-weight: 600; color: var(--ok); }
  .relaunch .rl-msg { font: inherit; padding: 6px 10px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; box-sizing: border-box; }
  .relaunch .rl-acts { display: flex; gap: 6px; }
  .open .recap .summary { border-top: 0; padding-top: 0; grid-template-columns: 140px 1fr; font-size: 0.88rem; }
  .open .recap .when { font-size: 0.75rem; color: var(--muted); margin-top: var(--u); }
  .open .recap .when.stale { color: var(--warn); }
  /* Profile = state, shown as a solid chip in its own column, always first: where the session runs.
     Switching is an action, so it is a button with a verb, never another chip. */
  .pf { display: inline-block; min-width: 44px; text-align: center; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
    color: #fff; background: var(--pf, var(--faint)); border-radius: 5px; padding: 2px 7px; white-space: nowrap; flex: none; }
  .pf.none { background: transparent; }
  .to-pf::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pf); margin-right: 6px; }
  /* stats: context gauge · compactions · cost. The gauge fills up to alert_context_tokens, where
     auto-compaction starts showing up, not to the model's window (1M would read 28% on a session
     about to compact); the tokens are written next to it. */
  .stats { display: flex; align-items: center; gap: calc(var(--u) * 1.25); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .gauge { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .gauge i { width: 72px; height: 8px; border-radius: 4px; border: 1px solid var(--rule-strong); overflow: hidden; display: block; box-sizing: content-box; }
  .gauge i b { display: block; height: 100%; background: var(--ok); }
  .gauge.mid i b { background: var(--warn); } .gauge.hi i b { background: var(--bad); }
  .gauge.mid { color: var(--warn); font-weight: 600; } .gauge.hi { color: var(--bad); font-weight: 600; }
  /* The limit next to the tokens, so "381k / 300k" can't be read as the status line's % of the window. */
  .gauge .of { color: var(--muted); font-weight: 400; margin-left: -2px; }
  .stats .hot { color: var(--warn); font-weight: 600; }
  .stats .cache.cold { color: var(--muted); font-style: italic; }
  .advice { font-size: 0.84rem; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; }
  @media (max-width: 860px) {
    .open .acts { justify-content: flex-start; margin-left: 0; }
    .open .recap .summary { grid-template-columns: 1fr; }
  }
  .empty-line { font-size: 0.88rem; color: var(--muted); }

  /* ------------------------------------------------------------------ map + detail */
  .board { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: calc(var(--u) * 3); align-items: start; }
  .map { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: var(--u) 0; }
  .line { padding: var(--u) 0; }
  .line + .line { border-top: 1px solid var(--rule); }
  .line-h { display: flex; align-items: center; gap: var(--u); padding: 4px calc(var(--u) * 2); font-size: 0.8rem; font-weight: 700; }
  .line-h .bullet { width: 18px; height: 18px; border-radius: 50%; background: var(--line); display: grid; place-items: center; flex: none; }
  .line-h .bullet::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--panel); }
  .line-h .ct { margin-left: auto; color: var(--muted); font-weight: 600; }
  .stops { list-style: none; position: relative; }
  /* the line itself: one stroke through every stop of the project */
  .stops::before { content: ""; position: absolute; left: calc(var(--u) * 2 + 7px); top: 0; bottom: 16px; width: 4px; background: var(--line); border-radius: 2px; }
  .stop { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: var(--u); width: 100%; text-align: left;
    font: inherit; color: inherit; background: none; border: 0; padding: 7px calc(var(--u) * 2); cursor: pointer; position: relative; }
  .stop:hover { background: var(--raised); }
  .stop .node { width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 3px solid var(--line); justify-self: center; position: relative; z-index: 1; transition: transform 160ms cubic-bezier(.2,.8,.2,1); }
  .stop .t { font-size: 0.88rem; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stop .a { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .stop.reboot .a { color: var(--warn); }
  .stop[aria-current="true"] { background: var(--accent-soft); }
  .stop[aria-current="true"] .node { background: var(--line); transform: scale(1.35); }
  .stop[aria-current="true"] .t { font-weight: 650; }
  .terminus, .closed-line { --line: var(--rule-strong); }
  .closed-line .t { color: var(--body); }
  .terminus .stop { cursor: default; }
  .terminus .stop:hover { background: none; }
  .terminus .t { color: var(--muted); }
  .map-empty { padding: var(--u) calc(var(--u) * 2); color: var(--muted); font-size: 0.88rem; }

  .detail { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
    padding: calc(var(--u) * 3); display: flex; flex-direction: column; gap: calc(var(--u) * 2.5); position: sticky; top: 76px; min-width: 0; }
  .sign { display: inline-flex; align-items: center; gap: var(--u); align-self: flex-start; font-size: 0.8rem; font-weight: 700;
    border: 2px solid var(--line); border-radius: 999px; padding: 2px 12px 2px 4px; }
  .sign .bullet { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
  .sign .sub { font-weight: 500; color: var(--muted); }
  .detail h1 { font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.015em; text-wrap: balance; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px calc(var(--u) * 2); font-size: 0.82rem; color: var(--muted); }
  .facts b { color: var(--body); font-weight: 600; }
  .facts .reboot { color: var(--warn); font-weight: 600; }
  .summary { display: grid; grid-template-columns: 150px 1fr; gap: calc(var(--u) * 1.5) calc(var(--u) * 2.5); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 2.5); }
  .summary dt { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .summary dd { color: var(--body); max-width: 68ch; overflow-wrap: anywhere; }
  .summary dd.next { color: var(--ink); font-weight: 600; }
  /* Beside the map the detail is ~480px wide: a 150px label column would leave the summary a
     sliver and push the card past the screen. Labels go above their text there. */
  @media (max-width: 1100px) { .detail .summary { grid-template-columns: 1fr; gap: 4px; } .detail .summary dd { margin-bottom: calc(var(--u) * 1.5); } }
  .path { color: var(--muted); overflow-wrap: anywhere; }
  .actions { display: flex; align-items: center; gap: var(--u); flex-wrap: wrap; }
  .btn { font: inherit; font-size: 0.88rem; font-weight: 600; border-radius: 6px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink); transition: background 150ms, border-color 150ms; }
  .btn:hover { background: var(--raised); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.danger { color: var(--bad); border-color: transparent; background: transparent; }
  .btn.danger:hover { background: var(--bad-soft); }
  .btn.danger.armed { background: var(--bad); color: var(--panel); }
  .btn.small { padding: 4px 10px; font-size: 0.8rem; }
  .btn:disabled { opacity: 0.55; cursor: progress; }
  .btn kbd { font: 600 0.68rem ui-monospace, monospace; opacity: 0.7; margin-left: 6px; }
  .note { font-size: 0.84rem; color: var(--muted); }
  .note.ok { color: var(--ok); } .note.bad { color: var(--bad); }
  .cmd { display: flex; gap: var(--u); align-items: center; flex-wrap: wrap; flex-basis: 100%; }
  .cmd code { background: var(--raised); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; user-select: all; overflow-wrap: anywhere; }
  .detail-empty { color: var(--muted); }
  .detail-empty h1 { color: var(--ink); font-size: 1.25rem; margin-bottom: var(--u); }
  .err { color: var(--bad); font-size: 0.88rem; }

  /* loading skeleton */
  .sk { background: linear-gradient(90deg, var(--raised), var(--rule), var(--raised)); background-size: 200% 100%; border-radius: 6px; animation: sk 1.2s ease-in-out infinite; }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  @media (max-width: 860px) {
    .bar-in { flex-wrap: wrap; padding: var(--u) calc(var(--u) * 2); row-gap: var(--u); }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .search kbd, .counts span.l, .herdr span { display: none; }
    .counts { margin-left: auto; }
    .page { padding: calc(var(--u) * 2); gap: calc(var(--u) * 2.5); }
    .board { grid-template-columns: 1fr; }
    .detail { position: static; padding: calc(var(--u) * 2); box-shadow: none; }
    /* on narrow screens the detail opens inside the map, right under the selected stop */
    .stops .detail { margin: 4px calc(var(--u) * 1.5) var(--u) calc(var(--u) * 5); }
    .summary { grid-template-columns: 1fr; gap: 4px; }
    .summary dd + dt { margin-top: var(--u); }
    .btn kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 4v24M23 4v9a7 7 0 0 1-7 7H9" stroke="#e4572e" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="9" cy="20" r="4" fill="currentColor"/></svg>
      herdr-valet <span class="who" id="who"></span>
    </div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search parked sessions" aria-label="Search parked sessions" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="counts" aria-live="polite"><div><b id="n-parked">–</b> <span class="l">parked</span></div><div><b id="n-live">–</b> <span class="l">open</span></div><div id="n-alerts-w" hidden><b id="n-alerts">–</b> <span class="l">alerts</span></div></div>
    <div class="herdr" id="herdr"><i></i><span>herdr</span></div>
  </div>
</header>

<main class="page">
  <div id="banner"></div>

  <section aria-labelledby="h-open">
    <div class="sect-row">
      <h2 class="sect" id="h-open">Open now <span class="n" id="c-live"></span></h2>
      <div class="acts" id="all-acts"></div>
      <div class="note" id="all-note"></div>
    </div>
    <div class="platform" id="live"><div class="sk" style="height:42px;width:260px"></div><div class="sk" style="height:42px;width:220px"></div></div>
  </section>

  <section class="board" aria-label="Parked sessions">
    <nav class="map" id="map" aria-label="Parked sessions by project">
      <div style="padding:8px 16px;display:grid;gap:12px"><div class="sk" style="height:16px;width:50%"></div><div class="sk" style="height:14px"></div><div class="sk" style="height:14px;width:80%"></div><div class="sk" style="height:14px;width:65%"></div></div>
    </nav>
    <article class="detail" id="detail" aria-live="polite"><div class="sk" style="height:22px;width:30%"></div><div class="sk" style="height:30px;width:75%"></div><div class="sk" style="height:90px"></div></article>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const days = (iso) => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null;
const ago = (iso) => { const d = days(iso); return d === null ? "—" : d === 0 ? "today" : d === 1 ? "1 day ago" : `${d} days ago`; };
const short = (iso) => { const d = days(iso); return d === null ? "—" : d === 0 ? "today" : `${d}d`; };
const narrow = matchMedia("(max-width: 860px)");
// Held by reference: on narrow screens it lives inside the map, which is rebuilt on every render.
const DETAIL = $("detail");

// Line colors: a project keeps the same color everywhere, derived from its name. Mid-lightness
// hues that hold up on both the light and the dark ground, none of them orange, amber or red:
// those mean an alert, and a project must never look like one.
const LINES = ["#0f9fb5", "#2a9d8f", "#7d8597", "#4361ee", "#9b5de5", "#3f9e58", "#b5179e", "#1f8fd6", "#c06c84", "#6c8a2b"];
function lineColor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return LINES[h % LINES.length];
}
const project = (label) => (label || "?").split("/")[0];

// The summary comes as "Title:", "Where we left off:", etc. (sometimes in bold). Cards written
// before the switch to English use the Spanish labels: they map to the same fields.
const LABELS = {
  "Title": "Title", "Where we left off": "Where we left off", "Still pending": "Still pending", "Next step": "Next step",
  "Título": "Title", "En qué estábamos": "Where we left off", "Quedó pendiente": "Still pending", "Próximo paso": "Next step",
};
function parseSummary(text) {
  const out = {};
  for (const raw of (text || "").split("\n")) {
    const line = raw.replace(/\*\*/g, "").trim();
    const i = line.indexOf(":");
    const key = i > 0 ? LABELS[line.slice(0, i).trim()] : null;
    if (key) out[key] = line.slice(i + 1).trim();
  }
  if (!Object.keys(out).length) out["Where we left off"] = text;
  return out;
}

async function post(path, body) {
  const headers = { "X-Parking": "1", ...(body ? { "Content-Type": "application/json" } : {}) };
  const r = await fetch(path, { method: "POST", headers, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || `HTTP ${r.status}`), { command: data.command });
  return data;
}

// Command to copy, falling back to selecting the text when the browser won't allow copying.
function commandBox(cmd) {
  const box = document.createElement("div");
  box.className = "cmd";
  box.innerHTML = `<code>${esc(cmd)}</code><button class="btn small">Copy</button>`;
  const [code, btn] = [box.querySelector("code"), box.querySelector("button")];
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(cmd); btn.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = "Selected"; }
    setTimeout(() => (btn.textContent = "Copy"), 2000);
  };
  return box;
}

// Profiles (accounts / launchers): name -> label, and the ones a session could switch to.
const profileLabel = (name) => ST.profiles.find((p) => p.name === name)?.label || name;
const otherProfiles = (name) => ST.profiles.filter((p) => p.name !== name);
// Each profile keeps one color everywhere, by its position in the config.
const PF_COLORS = ["#5b5f6b", "#2f5bd3", "#a0611a", "#2a8a5e"];
const pfColor = (name) => PF_COLORS[Math.max(0, ST.profiles.findIndex((p) => p.name === name)) % PF_COLORS.length];
const pfBadge = (name) => ST.profiles.length
  ? (name ? `<span class="pf" style="--pf:${pfColor(name)}" title="Runs on ${esc(profileLabel(name))}">${esc(profileLabel(name))}</span>` : `<span class="pf none"></span>`)
  : "";
const ktok = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : `${Math.round(n / 1000)}k`;
const money = (n) => n >= 100 ? `$${Math.round(n)}` : `$${n.toFixed(2)}`;
// Context gauge · compactions · estimated cost. Cost is at Anthropic list prices: on a
// subscription it is what the session would have cost, not a charge.
function statsHtml(st) {
  if (!st) return "";
  const limit = ST.alert_context_tokens;
  const fill = Math.min(100, (100 * st.context_tokens) / limit);
  const lvl = fill >= 100 ? "hi" : fill >= 75 ? "mid" : "";
  const lc = st.last_compaction;
  const compTitle = lc ? `Last: ${ago(lc.at)}, ${lc.trigger}, from ${ktok(lc.pre_tokens || 0)} tokens` : "Never compacted";
  const costTitle = `Estimated at list prices${st.subagents ? `, ${st.subagents} subagents included` : ""}${st.unpriced_models.length ? `; no price for ${st.unpriced_models.join(", ")}` : ""}`;
  const ctxTitle = `Context: ${ktok(st.context_tokens)} tokens. The bar fills up to ${ktok(limit)} (alert_context_tokens), the zone where auto-compaction happens` +
    `${lc ? ` (this session last compacted at ${ktok(lc.pre_tokens || 0)})` : ""}; the model's window is ${ktok(st.context_window)}.`;
  return `<span class="gauge ${lvl}" role="meter" aria-label="Context" aria-valuemin="0" aria-valuemax="${limit}" aria-valuenow="${Math.min(st.context_tokens, limit)}" title="${esc(ctxTitle)}"><i><b style="width:${fill}%"></b></i>${ktok(st.context_tokens)}<span class="of">/ ${ktok(limit)}</span></span>
    <span title="${esc(compTitle)}">${st.compactions} compact${st.compactions === 1 ? "" : "s"}</span>
    <span title="${esc(costTitle)}">≈ ${money(st.cost_usd)}</span>${cacheHtml(st)}`;
}
// The prompt cache: Claude Code keeps it 1 h on a subscription, 5 min on an API key, from the
// last reply. Cold, the next message writes the whole context again.
function cacheHtml(st) {
  const c = st.cache;
  if (!c) return "";
  const left = (Date.parse(c.expires_at) - Date.now()) / 60000;
  const cold = c.cold_usd == null ? "" : ` ≈ ${money(c.cold_usd)}`;
  if (left > 0) {
    const soon = left < 10 ? "hot" : "";
    return `<span class="cache ${soon}" title="Prompt cache (${c.ttl}) warm for ${Math.ceil(left)} more min: the next message reads the context from it${c.warm_usd == null ? "" : ` (≈ ${money(c.warm_usd)})`}. After that it writes all ${ktok(st.context_tokens)} again${cold}.">cache ${Math.ceil(left)}m</span>`;
  }
  return `<span class="cache cold" title="Prompt cache (${c.ttl}) expired ${ago(c.expires_at)}: resuming writes all ${ktok(st.context_tokens)} tokens of context again${cold}. Start fresh begins without them.">cold${cold}</span>`;
}
// Whether a parked session is better started fresh than resumed: its context is past the limit, or
// resuming re-sends more than alert_cold_usd (a parked card's cache is always cold by then).
function freshAdvice(st) {
  if (!st) return "";
  const why = [];
  if (st.context_tokens >= ST.alert_context_tokens) why.push(`${ktok(st.context_tokens)} tokens of context`);
  if (st.cache?.cold_usd != null && st.cache.cold_usd >= ST.alert_cold_usd) why.push(`resuming re-sends it all (≈ ${money(st.cache.cold_usd)})`);
  return why.length ? `${why.join("; ")}: Start fresh picks it up from this card instead.` : "";
}
function summaryHtml(text) {
  const s = parseSummary(text);
  return `<dl class="summary">
    ${s["Title"] ? `<dt>Title</dt><dd>${esc(s["Title"])}</dd>` : ""}
    ${s["Where we left off"] ? `<dt>Where we left off</dt><dd>${esc(s["Where we left off"])}</dd>` : ""}
    ${s["Still pending"] ? `<dt>Still pending</dt><dd>${esc(s["Still pending"])}</dd>` : ""}
    ${s["Next step"] ? `<dt>Next step</dt><dd class="next">${esc(s["Next step"])}</dd>` : ""}
  </dl>`;
}
// Two-click confirmation in place, not a browser dialog.
function arm(btn, label, note, msg) {
  if (btn.classList.contains("armed")) return true;
  const was = btn.innerHTML;  // a menu item carries its hint in markup
  btn.classList.add("armed"); btn.textContent = label;
  note.className = "note"; note.textContent = msg;
  setTimeout(() => { btn.classList.remove("armed"); btn.innerHTML = was; if (note.textContent === msg) note.textContent = ""; }, 5000);
  return false;
}
const shownRecaps = new Set();  // session ids whose recap is unfolded
const openMenus = new Set();    // session ids whose "⋯" menu is open: a refresh keeps it open
let relaunching = null;         // session id whose Relaunch panel is open: the page holds still meanwhile

let ST = null;          // last /api/state
let selected = null;    // session_id of the selected stop
let query = "";
let busy = false;       // an action is in flight: don't re-render under the user

function matches(c) {
  if (!query) return true;
  const hay = [c.label, c.cwd, c.branch, c.model, c.summary].join(" ").toLowerCase();
  return query.split(/\s+/).every((w) => hay.includes(w));
}
const isReboot = (c) => c.reason === "reboot" || c.reason === "reinicio";
const isClosed = (c) => c.reason === "closed";
// Parked first, then closed by hand: the order the map shows them, and ↑/↓ follow.
const visibleCards = () => { const v = ST.parked.filter(matches); return [...v.filter((c) => !isClosed(c)), ...v.filter(isClosed)]; };
const daysLeft = (c) => Math.max(0, Math.ceil(ST.closed_keep_days - (Date.now() - new Date(c.parked_at).getTime()) / 86400000));

// ------------------------------------------------------------------ open now
function renderLive() {
  const live = $("live");
  live.replaceChildren();
  $("c-live").textContent = ST.live.length || "";
  if (ST.herdr_error) { live.innerHTML = `<p class="err">Could not read herdr: ${esc(ST.herdr_error)}</p>`; return; }
  if (!ST.live.length) { live.innerHTML = `<p class="empty-line">No Claude sessions open in herdr.</p>`; return; }
  // Same order as herdr's sidebar: workspace, then tab. Alerts get a band of their own.
  const pos = (s) => (s.workspace_number ?? 999) * 1000 + (s.tab_number ?? 999);
  [...ST.live].sort((a, b) => pos(a) - pos(b)).forEach((s) => {
    const el = document.createElement("div");
    el.className = "open";
    el.style.setProperty("--line", lineColor(project(s.label)));
    const working = s.status === "working" || s.status === "blocked";
    const idle = s.idle_days == null ? "idle" : s.idle_days < 1 ? "idle today" : `idle ${Math.floor(s.idle_days)}d`;
    // Where it is in herdr (workspace › tab, as named there) leads; the conversation title
    // follows. Unnamed tabs fall back to the folder.
    const place = s.place || s.label;
    const [ws, ...rest] = place.split("/");
    const tabName = rest.join("/");
    const rc = s.recap;
    const switches = working ? [] : otherProfiles(s.profile);
    const alerts = s.stats?.alerts || [];
    // One action of its own at most: Park while idle; the rest wait behind "⋯". An alert brings
    // Relaunch, on its band. A working session shows only "⋯".
    const item = (act, label, hint, extra = "") => `<button role="menuitem" data-act="${act}" ${extra}>${label}<small>${hint}</small></button>`;
    const menu = [
      item("recap", rc && shownRecaps.has(s.session_id) ? "Hide recap" : "Recap", rc && !rc.stale ? "Where it stands, written earlier" : "Haiku writes where it stands, ~15 s"),
      ...(working || alerts.length ? [] : [item("relaunch", "Relaunch", "Move the work to a new session that starts from the essentials, not this whole context")]),
      item("fork", "Fork", "A copy of the conversation in a new tab, to ask something else there"),
      ...(working ? [] : [item("restart", "Restart", "Close Claude and reopen this conversation: loads updates, MCPs and plugins")]),
      ...switches.map((p) => item("switch", `Move to ${esc(p.label)}`, `Close it here and reopen the same conversation on ${esc(p.label)}`, `data-as="${esc(p.name)}"`)),
    ].join("");
    el.innerHTML = `<div class="open-row">
        ${pfBadge(s.profile)}
        <div class="who-s"><span class="place" title="${esc(`${s.label}${s.tab ? ` › tab “${s.tab}”` : ""} — ${s.cwd || ""}`)}">${esc(ws)}${tabName ? `<span class="sep">›</span><span class="tb">${esc(tabName)}</span>` : ""}</span>
          <span class="nm" title="${esc(s.title)}">${esc(s.title || "")}</span></div>
        <span class="st ${working ? "working" : ""}">${working ? (s.status === "blocked" ? "waiting" : "working") : idle}</span>
        <div class="foot">
        <div class="stats">${statsHtml(s.stats)}</div>
        <div class="acts">
          ${working ? "" : `<button class="btn small" data-act="park" title="Haiku writes its card and the pane closes; Resume brings it back">Park</button>`}
          <details class="more" ${openMenus.has(s.session_id) ? "open" : ""}><summary class="btn small" aria-label="More actions for ${esc(place)}" title="More actions">⋯</summary>
            <div class="menu" role="menu">${menu}</div></details>
        </div>
        </div>
      </div>
      ${alerts.length ? `<div class="alertbar"><span class="why">${alerts.map(esc).join(" · ")}</span>
        ${working ? "" : `<button class="btn small primary" data-act="relaunch" title="Move the work to a new session that starts from the essentials, not this whole context">Relaunch</button>`}</div>` : ""}
      ${relaunching === s.session_id && !working ? relaunchHtml(s) : ""}
      <div class="note" data-note></div>
      ${rc && shownRecaps.has(s.session_id) ? `<div class="recap">${summaryHtml(rc.summary)}
        <p class="when ${rc.stale ? "stale" : ""}">${rc.stale ? "The conversation moved on since this recap — press Recap again to refresh." : `Recap from ${ago(rc.at)}.`}</p></div>` : ""}`;
    const note = el.querySelector("[data-note]");
    const buttons = [...el.querySelectorAll("button")];
    const run = async (btn, msg, path, after, body, done) => {
      openMenus.delete(s.session_id);
      busy = true; buttons.forEach((b) => (b.disabled = true)); note.className = "note"; note.textContent = msg;
      try {
        const r = await post(path, body); await after(r); busy = false;
        // A message to read stays a moment before the refresh takes the row away.
        if (done) { note.className = "note ok"; note.textContent = done; setTimeout(load, 4000); } else load();
      }
      catch (e) { busy = false; note.className = "note bad"; note.textContent = e.message; buttons.forEach((b) => (b.disabled = false)); }
    };
    const pane = encodeURIComponent(s.pane_id);
    const more = el.querySelector(".more");
    more.addEventListener("toggle", () => { more.open ? openMenus.add(s.session_id) : openMenus.delete(s.session_id); });
    for (const btn of buttons) {
      const act = btn.dataset.act;
      if (act === "recap") btn.onclick = () => {
        // A fresh recap just folds and unfolds; a missing or stale one is asked for again.
        if (rc && !rc.stale) {
          openMenus.delete(s.session_id);
          shownRecaps.has(s.session_id) ? shownRecaps.delete(s.session_id) : shownRecaps.add(s.session_id);
          renderLive(); return;
        }
        run(btn, "Summarizing… ~15 s", `api/recap/${pane}`, () => shownRecaps.add(s.session_id));
      };
      else if (act === "restart") btn.onclick = () => run(btn, "Restarting… ~10 s", `api/restart/${pane}`, () => {});
      else if (act === "fork") btn.onclick = () => run(btn, "Opening the copy in a new tab… ~10 s", `api/fork/${pane}`, () => {});
      else if (act === "park") btn.onclick = () =>
        run(btn, rc && !rc.stale ? "Closing…" : "Summarizing and closing… ~15 s", `api/park/${pane}`, (r) => { selected = r.card?.session_id || selected; });
      else if (act === "relaunch") btn.onclick = () => {
        openMenus.delete(s.session_id);
        relaunching = relaunching === s.session_id ? null : s.session_id;
        renderLive();
        if (relaunching) document.querySelector(`.relaunch[data-sid="${s.session_id}"] .rl-msg`)?.focus();
      };
      else if (btn.dataset.rl === "cancel") btn.onclick = () => { relaunching = null; renderLive(); };
      else if (btn.dataset.rl === "go") btn.onclick = () => {
        const panel = el.querySelector(".relaunch");
        const mode = panel.querySelector("input[type=radio]:checked")?.value || "fresh";
        const prompt = panel.querySelector(".rl-msg").value.trim();
        relaunching = null;
        run(btn, mode === "handoff" ? "Asking the session for a handoff…" : "Parking, then relaunching fresh… ~20 s",
          `api/relaunch/${pane}`, () => {}, { mode, prompt },
          mode === "handoff" ? "Asked: the session writes its handoff, then a new tab opens from it and this one parks (~1 min)."
            : "Done: the new session is starting in a tab of this workspace.");
      };
      else if (act === "switch") btn.onclick = () => {
        const label = profileLabel(btn.dataset.as);
        if (!arm(btn, `Move to ${label}? Click again`, note, `Closes it here and reopens the same conversation on ${label}, in a tab of this workspace.`)) return;
        run(btn, `Moving to ${label}… ~20 s`, `api/switch/${pane}?as=${encodeURIComponent(btn.dataset.as)}`, () => {});
      };
    }
    const msg = el.querySelector(".rl-msg");
    if (msg) msg.onkeydown = (e) => {
      if (e.key === "Enter") el.querySelector('[data-rl="go"]').click();
      else if (e.key === "Escape") el.querySelector('[data-rl="cancel"]').click();
    };
    live.append(el);
  });
}

// Relaunch: the two ways, what each costs now, the recommended one checked (a handoff while the
// prompt cache is warm, fresh once it is cold), and the new session's first message.
function relaunchHtml(s) {
  const p = s.relaunch;
  if (!p) return "";
  const left = p.expires_at ? Math.ceil((Date.parse(p.expires_at) - Date.now()) / 60000) : 0;
  const cache = p.warm ? `cache warm, ${left} min left` : "cache cold";
  const hp = p.handoff_usd == null ? "one message" : `≈ ${money(p.handoff_usd)}`;
  const canHandoff = ST.relaunch_hook;
  const rec = canHandoff ? p.recommended : "fresh";
  const opt = (mode, name, cost, hint, disabled) => `<label class="rl-opt ${disabled ? "off" : ""}">
      <input type="radio" name="rl-${esc(s.session_id)}" value="${mode}" ${rec === mode ? "checked" : ""} ${disabled ? "disabled" : ""}>
      <span><b>${name}</b> <span class="rl-cost">${cost}</span>${rec === mode ? ` <span class="rl-rec">recommended</span>` : ""}<small>${hint}</small></span></label>`;
  return `<div class="relaunch" data-sid="${esc(s.session_id)}">
    <p class="rl-head">A new session picks up from the essentials instead of these ${ktok(p.context_tokens)} tokens (${cache}). This one parks.</p>
    ${opt("handoff", "Handoff + continue", hp, canHandoff
      ? "Claude writes a handoff here, decisions and their why included, and the new session starts from it."
      : "Needs the hook in Claude Code's settings (see the README).", !canHandoff)}
    ${opt("fresh", "Fresh", "$0", "valet writes the context file from the transcript, no Claude. Faster; some of the why is lost.", false)}
    <input class="rl-msg" type="text" placeholder="First message for the new session (optional)" aria-label="First message for the new session">
    <div class="rl-acts"><button class="btn small primary" data-rl="go">Relaunch</button><button class="btn small" data-rl="cancel">Cancel</button></div>
  </div>`;
}

// Park all (before a reboot) and Restore (the newest batch: a Park all, or what a reboot cut off).
function renderAllActions() {
  const acts = $("all-acts"), note = $("all-note");
  acts.replaceChildren();
  const b = ST.batch;
  if (b && ST.herdr_running) {
    const btn = document.createElement("button");
    btn.className = "btn small primary";
    btn.textContent = `Restore ${b.count}`;
    btn.title = b.reason === "reboot"
      ? `Reopen the ${b.count} sessions the reboot cut off, each in its workspace and tab`
      : `Reopen the ${b.count} sessions parked with Park all (${ago(b.at)}), each in its workspace and tab`;
    btn.onclick = () => runAll(btn, `Reopening ${b.count} sessions…`, "api/restore",
      (r) => { const bad = r.sessions.filter((x) => x.error); return bad.length ? `Could not reopen: ${bad.map((x) => `${x.label} (${x.error})`).join("; ")}` : ""; });
    acts.append(btn);
  }
  if (ST.live.length) {
    const btn = document.createElement("button");
    btn.className = "btn small";
    btn.textContent = "Park all";
    btn.title = "Before a reboot: park every open session with its summary; Restore brings them back where they were";
    btn.onclick = () => {
      if (!arm(btn, `Park all ${ST.live.length}? Click again`, note, `Writes a card for each open session, then closes them. Restore reopens them in the same places.`)) return;
      runAll(btn, `Summarizing and closing ${ST.live.length} sessions… ~30 s`, "api/park-all",
        (r) => r.failed.length ? `Left open (no card): ${r.failed.map((x) => x.label).join(", ")}` : "");
    };
    acts.append(btn);
  }
}
async function runAll(btn, msg, path, problems) {
  const note = $("all-note"), buttons = [...$("all-acts").querySelectorAll("button")];
  busy = true; buttons.forEach((b) => (b.disabled = true)); note.className = "note"; note.textContent = msg;
  try { const r = await post(path); busy = false; const p = problems(r); note.className = p ? "note bad" : "note"; note.textContent = p; load(); }
  catch (e) { busy = false; note.className = "note bad"; note.textContent = e.message; buttons.forEach((b) => (b.disabled = false)); }
}

// ------------------------------------------------------------------ the line map
function renderMap() {
  const map = $("map");
  if (map.contains(DETAIL)) map.after(DETAIL);
  map.replaceChildren();
  const all = visibleCards();
  const cards = all.filter((c) => !isClosed(c)), closed = all.filter(isClosed);
  if (!ST.parked.length) map.innerHTML = `<p class="map-empty">No parked sessions yet.</p>`;
  else if (!all.length) map.innerHTML = `<p class="map-empty">Nothing matches “${esc(query)}”.</p>`;
  const stop = (c, when, whenTitle) => {
    const s = parseSummary(c.summary);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "stop" + (isReboot(c) ? " reboot" : "");
    b.dataset.id = c.session_id;
    b.setAttribute("aria-current", String(c.session_id === selected));
    b.innerHTML = `<span class="node" aria-hidden="true"></span><span class="t">${esc(s["Title"] || c.label)}</span><span class="a" title="${esc(whenTitle)}">${esc(when)}</span>`;
    b.onclick = () => select(c.session_id, true);
    li.append(b);
    return li;
  };
  // Group by project; the API already sorts newest first, so lines follow their latest stop.
  const groups = new Map();
  for (const c of cards) {
    const p = project(c.label);
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(c);
  }
  for (const [p, list] of groups) {
    const sec = document.createElement("section");
    sec.className = "line";
    sec.style.setProperty("--line", lineColor(p));
    sec.innerHTML = `<h3 class="line-h"><span class="bullet" aria-hidden="true"></span>${esc(p)}<span class="ct">${list.length}</span></h3><ol class="stops"></ol>`;
    const ol = sec.querySelector("ol");
    for (const c of list) ol.append(stop(c, short(c.last_activity || c.parked_at), "Last message"));
    map.append(sec);
  }
  // Closed by hand: kept a few days in case closing was a mistake, in grey, after the lines.
  if (closed.length) {
    const sec = document.createElement("section");
    sec.className = "line closed-line";
    sec.innerHTML = `<h3 class="line-h" title="Panes you closed yourself. Each card goes away ${esc(ST.closed_keep_days)} days after closing."><span class="bullet" aria-hidden="true"></span>Closed by hand<span class="ct">${closed.length}</span></h3><ol class="stops"></ol>`;
    const ol = sec.querySelector("ol");
    for (const c of closed) ol.append(stop(c, `${project(c.label)} · ${daysLeft(c)}d left`, "Goes away after this"));
    map.append(sec);
  }
  // Terminus: recently resumed, in grey, at the end of the map.
  if (ST.history.length && !query) {
    const sec = document.createElement("section");
    sec.className = "line terminus";
    sec.innerHTML = `<h3 class="line-h"><span class="bullet" aria-hidden="true"></span>Recently resumed<span class="ct">${ST.history.length}</span></h3><ol class="stops"></ol>`;
    const ol = sec.querySelector("ol");
    for (const c of ST.history.slice(0, 8)) {
      const s = parseSummary(c.summary);
      const li = document.createElement("li");
      li.innerHTML = `<div class="stop"><span class="node" aria-hidden="true"></span><span class="t">${esc(s["Title"] || c.label)}</span><span class="a">${short(new Date(c.resumed_at * 1000).toISOString())}</span></div>`;
      ol.append(li);
    }
    map.append(sec);
  }
}

// ------------------------------------------------------------------ detail
function renderDetail() {
  const d = DETAIL;
  d.replaceChildren();
  const c = ST.parked.find((x) => x.session_id === selected);
  if (!c) {
    d.style.removeProperty("--line");
    d.innerHTML = `<div class="detail-empty"><h1>${ST.parked.length ? "Pick a stop" : "Nothing parked"}</h1>
      <p>${ST.parked.length
        ? "Choose a session on the map to see where you left off and resume it."
        : `Sessions idle for more than ${esc(ST.idle_days)} days park themselves here, with a summary of where you left off. You can also park an open one with <b>Park</b>.`}</p></div>`;
    placeDetail();
    return;
  }
  const s = parseSummary(c.summary);
  const p = project(c.label);
  const advice = freshAdvice(c.stats);
  const sub = c.label.includes("/") ? c.label.split("/").slice(1).join("/") : "";
  d.style.setProperty("--line", lineColor(p));
  d.innerHTML = `
    <span class="sign"><span class="bullet" aria-hidden="true"></span>${esc(p)}${sub ? `<span class="sub">/ ${esc(sub)}</span>` : ""}</span>
    <h1>${esc(s["Title"] || c.label)}</h1>
    <div class="facts">
      <span title="Last message">Last active <b>${ago(c.last_activity || c.parked_at)}</b></span>
      ${c.branch ? `<span>Branch <b class="mono">${esc(c.branch)}</b></span>` : ""}
      <span>Model <b>${esc(c.model || "default")}</b></span>
      ${c.profile ? `<span>Runs on ${pfBadge(c.profile)}</span>` : ""}
      ${isReboot(c) ? `<span class="reboot" title="It was open when the machine rebooted">Cut off by a reboot</span>` : c.reason === "auto" ? `<span>Parked automatically</span>` : c.reason === "switch" ? `<span>Parked to switch profile</span>` : c.reason === "park-all" ? `<span>Parked with Park all</span>` : isClosed(c) ? `<span class="reboot" title="You closed its pane; this card goes away on its own">Closed by hand · goes away in ${daysLeft(c)}d</span>` : `<span>Parked by hand</span>`}
    </div>
    ${c.stats ? `<div class="stats">${statsHtml(c.stats)}</div>` : ""}
    ${advice ? `<p class="advice">${esc(advice)}</p>` : ""}
    <div class="actions">
      <button class="btn ${advice ? "" : "primary"}" data-act="resume">Resume${c.profile ? ` on ${esc(profileLabel(c.profile))}` : " in herdr"}<kbd>↵</kbd></button>
      ${otherProfiles(c.profile).map((p) => `<button class="btn to-pf" style="--pf:${pfColor(p.name)}" data-act="resume-as" data-as="${esc(p.name)}">Resume on ${esc(p.label)} instead</button>`).join("")}
      <button class="btn ${advice ? "primary" : ""}" data-act="fresh" title="A new Claude in the same directory and model, starting from this card, what you asked, the files it wrote and the repo as it is now. None of the old conversation is sent again; it can still look things up in the transcript.">Start fresh</button>
      <button class="btn danger" data-act="delete">Delete card</button>
      <span class="note"></span>
    </div>
    <dl class="summary">
      ${s["Where we left off"] ? `<dt>Where we left off</dt><dd>${esc(s["Where we left off"])}</dd>` : ""}
      ${s["Still pending"] ? `<dt>Still pending</dt><dd>${esc(s["Still pending"])}</dd>` : ""}
      ${s["Next step"] ? `<dt>Next step</dt><dd class="next">${esc(s["Next step"])}</dd>` : ""}
    </dl>
    <div class="path mono" title="Directory">${esc(c.cwd)}</div>`;
  const note = d.querySelector(".note");
  const all = [...d.querySelectorAll(".actions button")];
  const del = d.querySelector('[data-act="delete"]');
  const resumeWith = async (as) => {
    busy = true; all.forEach((b) => (b.disabled = true));
    note.className = "note"; note.textContent = "Opening…";
    try {
      await post(`api/resume/${c.session_id}${as ? `?as=${encodeURIComponent(as)}` : ""}`);
      note.className = "note ok";
      note.textContent = `Done: the conversation is loaded in a tab of “${p}” in herdr${as ? `, with ${profileLabel(as)}` : ""}.`;
      setTimeout(() => { busy = false; selected = null; load(); }, 2200);
    } catch (e) {
      busy = false;
      note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false));
      d.querySelector(".cmd")?.remove();
      if (e.command) d.querySelector(".actions").append(commandBox(e.command));
    }
  };
  d.querySelector('[data-act="resume"]').onclick = () => resumeWith(null);
  d.querySelector('[data-act="fresh"]').onclick = async () => {
    busy = true; all.forEach((b) => (b.disabled = true));
    note.className = "note"; note.textContent = "Writing the context and opening…";
    try {
      await post(`api/fresh/${c.session_id}`);
      note.className = "note ok";
      note.textContent = `Done: a fresh session is starting in a tab of “${p}” in herdr, from this card.`;
      setTimeout(() => { busy = false; selected = null; load(); }, 2200);
    } catch (e) {
      busy = false;
      note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false));
      d.querySelector(".cmd")?.remove();
      if (e.command) d.querySelector(".actions").append(commandBox(e.command));
    }
  };
  d.querySelectorAll('[data-act="resume-as"]').forEach((b) => (b.onclick = () => resumeWith(b.dataset.as)));
  // Confirmation in place, not a browser dialog.
  del.onclick = async () => {
    if (!del.classList.contains("armed")) {
      del.classList.add("armed"); del.textContent = "Delete? Click again";
      note.className = "note"; note.textContent = "Claude keeps the conversation; only the card goes.";
      setTimeout(() => { del.classList.remove("armed"); del.textContent = "Delete card"; if (note.textContent.startsWith("Claude")) note.textContent = ""; }, 5000);
      return;
    }
    busy = true; all.forEach((b) => (b.disabled = true));
    try { const next = neighbor(1) || neighbor(-1); await post(`api/delete/${c.session_id}`); selected = next; busy = false; load(); }
    catch (e) { busy = false; note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false)); }
  };
  placeDetail();
}

// Desktop: the detail sits beside the map. Narrow: it opens inside the map under its stop.
function placeDetail() {
  const d = DETAIL;
  const stop = selected && document.querySelector(`.stop[data-id="${CSS.escape(selected)}"]`);
  if (narrow.matches && stop) stop.parentElement.after(d);
  else if (d.previousElementSibling !== $("map")) $("map").after(d);
}
narrow.addEventListener("change", placeDetail);

function neighbor(step) {
  const ids = visibleCards().map((c) => c.session_id);
  const i = ids.indexOf(selected);
  return i < 0 ? null : ids[i + step] ?? null;
}

function select(id, focus) {
  selected = id;
  document.querySelectorAll(".map .stop[data-id]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === id)));
  renderDetail();
  if (focus) document.querySelector(`.stop[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: narrow.matches });
}

function keepSelection() {
  const vis = visibleCards();
  if (!vis.some((c) => c.session_id === selected)) selected = narrow.matches ? null : vis[0]?.session_id ?? null;
}

// ------------------------------------------------------------------ load
async function load() {
  if (busy || relaunching) return;
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    ST = await r.json();
    $("who").textContent = ST.user;
    const nParked = ST.parked.filter((c) => !isClosed(c)).length;
    document.title = `herdr-valet · ${nParked} parked`;
    $("n-parked").textContent = nParked;
    $("n-live").textContent = ST.live.length;
    const nAlerts = ST.live.filter((s) => s.stats?.alerts?.length).length;
    $("n-alerts").textContent = nAlerts; $("n-alerts-w").hidden = !nAlerts;
    $("herdr").classList.toggle("down", !ST.herdr_running);
    $("herdr").title = ST.herdr_running ? "herdr is running" : "herdr is not running";
    $("banner").innerHTML = ST.herdr_running ? "" :
      `<div class="banner" role="status">herdr is not running — did the machine reboot? Resume needs it: open the terminal, or press Resume to get a command to run by hand.</div>`;
    keepSelection();
    // A confirmation waiting for its second click would be rebuilt unarmed: leave the rows be.
    if (!$("live").querySelector(".armed")) renderLive();
    renderAllActions();
    renderMap();
    renderDetail();
  } catch (e) {
    $("map").innerHTML = `<p class="map-empty err">Could not load: ${esc(e.message)}</p>`;
  }
}

document.addEventListener("click", (e) => {
  for (const d of document.querySelectorAll("details.more[open]")) if (!d.contains(e.target)) d.open = false;
});
document.addEventListener("keydown", (e) => {
  const d = e.key === "Escape" && e.target.closest?.("details.more[open]");
  if (d) { d.open = false; d.querySelector("summary").focus(); e.stopPropagation(); }
}, true);

$("q").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
  keepSelection();
  renderMap(); renderDetail();
});

// Keyboard: "/" searches, ↑/↓ (or j/k) move along the map, Enter resumes, Esc clears search.
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea");
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "Escape" && (typing || query)) { const q = $("q"); q.value = ""; q.dispatchEvent(new Event("input")); q.blur(); return; }
  if (typing || !ST) return;
  if (["ArrowDown", "j", "ArrowUp", "k"].includes(e.key)) {
    const step = e.key === "ArrowDown" || e.key === "j" ? 1 : -1;
    const next = neighbor(step) ?? (selected ? null : visibleCards()[0]?.session_id);
    if (next) { e.preventDefault(); select(next, true); }
  } else if (e.key === "Enter" && selected && (e.target === document.body || e.target.classList.contains("stop"))) {
    e.preventDefault(); DETAIL.querySelector('[data-act="resume"]')?.click();
  }
});

load();
// Statuses change while the page sits open next to the terminal: refresh while it's visible.
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
