      <button class="btn ${freshFirst ? "" : "primary"}" data-act="resume" title="Reopens the whole conversation${resumeWhy}">Resume${c.profile ? ` on <span class="pf-name">${esc(profileLabel(c.profile))}</span>` : " in herdr"}<span class="cost">${resumeCost}</span><kbd>↵</kbd></button>
      <button class="btn ${freshFirst ? "primary" : ""}" data-act="fresh" title="Costs cents: the new session reads a short context file, not the conversation. A new Claude in the same directory and model, starting from ${handoff ? "the handoff it left, " : ""}this card, what you asked, the files it wrote and the repo as it is now. None of the old conversation is sent again; it can still look things up in the transcript.">${handoff ? "Start fresh from handoff" : "Start fresh"}<span class="cost">&lt; $0.15</span></button>
      <button class="btn small" data-act="fork-card" title="A copy of this conversation in a new tab (its own session id), to ask it something else; this card stays parked">Fork</button>
      ${ST.can_launch ? `<button class="btn small" data-act="branch" title="A new session on another branch or worktree, starting from this card's context file (not the conversation); this card stays parked">Other branch…</button>` : ""}
      <button class="btn danger" data-act="delete">Delete card</button>
      <span class="note"></span>
    </div>
    <dl class="summary">
      ${s["Where we left off"] ? `<dt>Where we left off</dt><dd>${esc(s["Where we left off"])}</dd>` : ""}
      ${s["Still pending"] ? `<dt>Still pending</dt><dd>${esc(s["Still pending"])}</dd>` : ""}
      ${s["Next step"] ? `<dt>Next step</dt><dd class="next">${esc(s["Next step"])}</dd>` : ""}
    </dl>
    <div class="path mono" title="Directory">${esc(c.cwd)}</div>`;
  const note = d.querySelector(".note");
  const all = [...d.querySelectorAll(".actions button")];
  const del = d.querySelector('[data-act="delete"]');
  const resumeWith = async (as) => {
    busy = true; all.forEach((b) => (b.disabled = true));
    note.className = "note"; note.textContent = "Opening…";
    try {
      await post(`api/resume/${c.session_id}${as ? `?as=${encodeURIComponent(as)}` : ""}`);
      note.className = "note ok";
      note.textContent = `Done: the conversation is loaded in a tab of “${p}” in herdr${as ? `, with ${profileLabel(as)}` : ""}.`;
      setTimeout(() => { busy = false; selected = null; load(); }, 2200);
    } catch (e) {
      busy = false;
      note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false));
      d.querySelector(".cmd")?.remove();
      if (e.command) d.querySelector(".actions").append(commandBox(e.command));
    }
  };
  // The selected profile, or null for the one it ran with.
  const picked = () => {
    const v = d.querySelector(".pf-pick input:checked")?.value;
    return v && v !== c.profile ? v : null;
  };
  const showPick = () => {
    const as = picked();
    const btn = d.querySelector('[data-act="resume"]');
    btn.querySelector(".pf-name").textContent = profileLabel(as || c.profile);
    const usd = cache ? (as ? cache.cold_usd : resumeUsd) : null;
    btn.querySelector(".cost").textContent = usd != null ? `≈ ${money(usd)}` : "";
    btn.title = as ? `Reopens the whole conversation on ${profileLabel(as)}: another account, so none of this cache is there${usd != null ? ` (≈ ${money(usd)})` : ""}`
      : `Reopens the whole conversation${resumeWhy}`;
  };
  d.querySelectorAll(".pf-pick input").forEach((r) => (r.onchange = () => { pickedPf[c.session_id] = r.value; showPick(); }));
  if (picked()) showPick();
  d.querySelector('[data-act="resume"]').onclick = () => resumeWith(picked());
  d.querySelector('[data-act="fresh"]').onclick = async () => {
    const as = picked();
    busy = true; all.forEach((b) => (b.disabled = true));
    note.className = "note"; note.textContent = "Writing the context and opening…";
    try {
      await post(`api/fresh/${c.session_id}${as ? `?as=${encodeURIComponent(as)}` : ""}`);
      note.className = "note ok";
      note.textContent = `Done: a fresh session is starting in a tab of “${p}” in herdr, from this card${as ? `, with ${profileLabel(as)}` : ""}.`;
      setTimeout(() => { busy = false; selected = null; load(); }, 2200);
    } catch (e) {
      busy = false;
      note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false));
      d.querySelector(".cmd")?.remove();
      if (e.command) d.querySelector(".actions").append(commandBox(e.command));
    }
  };
  d.querySelector('[data-act="fork-card"]').onclick = async () => {
    const as = picked();
    busy = true; all.forEach((b) => (b.disabled = true));
    note.className = "note"; note.textContent = "Opening a copy…";
    try {
      await post(`api/fork-card/${c.session_id}${as ? `?as=${encodeURIComponent(as)}` : ""}`);
      note.className = "note ok";
      note.textContent = `Done: a copy of the conversation is opening in a tab of “${p}”. This card stays here.`;
      setTimeout(() => { busy = false; note.textContent = ""; all.forEach((b) => (b.disabled = false)); }, 2500);
    } catch (e) {
      busy = false;
      note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false));
      d.querySelector(".cmd")?.remove();
      if (e.command) d.querySelector(".actions").append(commandBox(e.command));
    }
  };
  const branchBtn = d.querySelector('[data-act="branch"]');
  if (branchBtn) branchBtn.onclick = async () => {
    note.className = "note"; note.textContent = "Writing the context file…";
    try {
      const r = await post(`api/context/${c.session_id}`);
      note.textContent = "";
      openNewPanel({ cwd: r.cwd, prompt: r.prompt });
    } catch (e) { note.className = "note bad"; note.textContent = e.message; }
  };
  // Confirmation in place, not a browser dialog.
  del.onclick = async () => {
    if (!del.classList.contains("armed")) {
      del.classList.add("armed"); del.textContent = "Delete? Click again";
      note.className = "note"; note.textContent = "Claude keeps the conversation; only the card goes.";
      setTimeout(() => { del.classList.remove("armed"); del.textContent = "Delete card"; if (note.textContent.startsWith("Claude")) note.textContent = ""; }, 5000);
      return;
    }
    busy = true; all.forEach((b) => (b.disabled = true));
    try { const next = neighbor(1) || neighbor(-1); await post(`api/delete/${c.session_id}`); selected = next; busy = false; load(); }
    catch (e) { busy = false; note.className = "note bad"; note.textContent = e.message; all.forEach((b) => (b.disabled = false)); }
  };
  placeDetail();
}

// Desktop: the detail sits beside the map. Narrow: it opens inside the map under its stop.
function placeDetail() {
  const d = DETAIL;
  const stop = selected && document.querySelector(`.stop[data-id="${CSS.escape(selected)}"]`);
  if (narrow.matches && stop) stop.parentElement.after(d);
  else if (d.previousElementSibling !== $("map")) $("map").after(d);
}
narrow.addEventListener("change", placeDetail);

function neighbor(step) {
  const ids = visibleCards().map((c) => c.session_id);
  const i = ids.indexOf(selected);
  return i < 0 ? null : ids[i + step] ?? null;
}

function select(id, focus) {
  selected = id;
  document.querySelectorAll(".map .stop[data-id]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === id)));
  renderDetail();
  if (focus) document.querySelector(`.stop[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: narrow.matches });
}

function keepSelection() {
  const vis = visibleCards();
  if (!vis.some((c) => c.session_id === selected)) selected = narrow.matches ? null : vis[0]?.session_id ?? null;
}

// ------------------------------------------------------------------ projects view
// The launcher's registry (project_command: `code project …`) with each worktree's git status:
// create, clone or add projects and clean up worktrees without a terminal. Team projects are
// read-only here; they change by PR to the launcher's config/projects.conf.
let VIEW = "sessions";
let PJ = { data: null, err: "", loading: false, tab: "", sel: null, q: "", panel: null, clean: null, scan: null, editing: null, removing: null,
  adhoc: null, done: null, launch: null, pending: null };
const KINDS = [["single", "A worktree per branch"], ["direct", "One folder, works on its branch"]];
const kindOptions = (sel) => KINDS.map(([v, l]) => `<option value="${v}" ${v === sel ? "selected" : ""}>${l}</option>`).join("");
const tilde = (p) => (PJ.data?.home && p && (p === PJ.data.home || p.startsWith(PJ.data.home + "/")) ? "~" + p.slice(PJ.data.home.length) : p || "");
const fromTs = (ts) => (ts ? new Date(ts * 1000).toISOString() : null);
const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;

function showView() {
  VIEW = location.hash === "#projects" ? "projects" : "sessions";
  $("view-sessions").hidden = VIEW !== "sessions";
  $("view-projects").hidden = VIEW !== "projects";
  document.querySelectorAll(".views a").forEach((a) =>
    a.dataset.view === VIEW ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const q = $("q");
  q.placeholder = VIEW === "projects" ? "Search projects and branches" : "Search parked sessions";
  q.setAttribute("aria-label", q.placeholder);
  q.value = VIEW === "projects" ? PJ.q : query;
  if (VIEW === "projects") pjLoad();
  else if (ST) load();
}

async function pjLoad() {
  if (PJ.loading) return;
  PJ.loading = true;
  try {
    const r = await fetch("api/project-list", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    PJ.data = d; PJ.err = "";
    PROJECTS = d.projects; PLUGINS = d.plugins || PLUGINS; USER_MCPS = d.user_mcps || USER_MCPS;
  } catch (e) {
    PJ.err = e.message;
  }
  PJ.loading = false;
  if (PJ.pending && PJ.data) pjApplyPending(); else pjRender();
}

function pjContexts() {
  const seen = [];
  for (const p of PJ.data?.projects || []) if (p.context && !seen.includes(p.context)) seen.push(p.context);
  if (!seen.includes("personal")) seen.push("personal");
  return seen;
}
// The GitHub owner most projects of a context use: where a new one of that context goes.
function pjOwner(ctx) {
  const n = {};
  for (const p of PJ.data?.projects || []) if (p.context === ctx && p.owner) n[p.owner] = (n[p.owner] || 0) + 1;
  return Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
}

// What a worktree's git status means, as chips; removable: a worktree of its own (never the main
// clone); safe: removing it loses nothing (clean, pushed, its work merged or none of its own).
function wtInfo(p, w) {
  const s = w.status || {}, main = w.path === p.path, chips = [];
  if (s.dirty) chips.push(["warn", `${s.dirty} uncommitted`, "Files with changes not committed"]);
  if (s.unpushed) chips.push(["warn", `${s.unpushed} unpushed`, "Commits not on its remote branch"]);
  if (!main && s.merged) chips.push(["ok", "merged", `Its changes are already in ${p.base}`]);
  else if (!main && s.ahead === 0) chips.push(["", "no commits of its own", `Nothing that is not in ${p.base}`]);
  else if (!main && s.ahead > 0) chips.push(["", `${s.ahead} ahead`, `Commits not in ${p.base}`]);
  if (!main && s.upstream === "gone" && !s.merged) chips.push(["", "remote branch deleted", "Its branch on origin is gone (deleted after a merge, or by hand)"]);
  if (w.open) chips.push(["live", `${w.open} open`, "Claude sessions running here"]);
  if (w.parked) chips.push(["", `${w.parked} parked`, "Parked cards in this folder"]);
  const removable = !main && p.type === "single";
  const safe = removable && !s.dirty && !s.unpushed && (s.merged || s.ahead === 0) && !w.open;
  return { chips, removable, safe };
}

// The view is a list and a detail, like Sessions: one line per project of the chosen context (or
// what the search matches in any), and the selected project's worktrees beside it. On a narrow
// screen the detail opens under its line.
const PJD = $("pj-detail");
const unsavedWt = (w) => !!(w.status?.dirty || w.status?.unpushed);
const safeList = (only) => (PJ.data?.projects || []).filter((p) => !only || p.id === only)
  .flatMap((p) => p.worktrees.map((w) => ({ p, w, i: wtInfo(p, w) }))).filter((x) => x.i.safe);

function pjRender() {
  const acts = $("pj-acts"), list = $("pj-list");
  const nSafe = PJ.data ? safeList().length : 0;
  acts.innerHTML = PJ.data ? `${nSafe ? `<button class="btn small" type="button" data-pj="clean" aria-expanded="${!!PJ.clean}" title="Worktrees you can remove without losing anything: review them and remove them in one go">Clean up ${nSafe}</button>` : ""}
    <button class="btn small" type="button" data-pj="fetch" title="git fetch --prune in every project, so merged branches and deleted remotes show up">Fetch all</button>
    <button class="btn small primary" type="button" data-pj="new" aria-expanded="${!!PJ.panel}">New project</button>` : "";
  acts.querySelector("[data-pj=new]")?.addEventListener("click", () => (PJ.panel ? pjClosePanel() : pjOpenPanel("create")));
  acts.querySelector("[data-pj=fetch]")?.addEventListener("click", (e) => pjFetch([], e.currentTarget));
  acts.querySelector("[data-pj=clean]")?.addEventListener("click", () => (PJ.clean ? pjCloseClean() : pjOpenClean(null)));
  if (list.contains(PJD)) list.after(PJD);
  if (PJ.err) { list.innerHTML = `<p class="map-empty err">Could not list projects: ${esc(PJ.err)}</p>`; PJD.hidden = true; return; }
  if (!PJ.data) return;
  $("pj-ctxs").innerHTML = pjContexts().map((c) => `<option value="${esc(c)}">`).join("");
  const all = PJ.data.projects, ctxs = pjContexts().filter((c) => all.some((p) => p.context === c));
  if (ST?.can_launch || PJ.data.adhoc.length) ctxs.push(ADHOC);
  $("c-proj").textContent = all.length;
  if (!ctxs.includes(PJ.tab)) {
    const saved = lsGet("valet-pj-tab");
    PJ.tab = ctxs.includes(saved) ? saved : ([...all].sort(recency)[0]?.context || ctxs[0]);
  }
  const words = PJ.q.split(/\s+/).filter(Boolean);
  const hit = (p) => words.every((w) => [p.id, p.label, p.path, p.context, p.owner, ...p.worktrees.map((x) => x.branch)].join(" ").toLowerCase().includes(w));
  const adhocTab = !words.length && PJ.tab === ADHOC;
  const shown = adhocTab ? [] : (words.length ? all.filter(hit) : all.filter((p) => p.context === PJ.tab)).sort(recency);
  const folders = adhocTab ? PJ.data.adhoc.slice(0, 40) : [];
  const ids = adhocTab ? [...(ST?.can_launch ? [ADHOC_NEW] : []), ...folders.map((a) => "adhoc:" + a.path)] : shown.map((p) => p.id);
  if (!ids.includes(PJ.sel)) { PJ.sel = narrow.matches ? null : ids[0] ?? null; PJ.launch = null; }
  if (PJ.sel === ADHOC_NEW && !PJ.launch) { PJ.launch = { id: ADHOC_NEW, prompt: "" }; NS = { ctx: ADHOC, id: "", wt: "", touched: false }; }

  const tabs = words.length ? `<p class="map-filter">Searching every context</p>`
    : `<div class="seg pj-tabs" role="tablist" aria-label="Context">${ctxs.map((c) => {
        const n = c === ADHOC ? PJ.data.adhoc.length : all.filter((p) => p.context === c).length;
        return `<button type="button" role="tab" data-tab="${esc(c)}" aria-pressed="${c === PJ.tab}" aria-selected="${c === PJ.tab}">${esc(c)}<b>${n}</b></button>`;
      }).join("")}</div>`;
  list.innerHTML = `${tabs}<ul class="pj-rows">${adhocTab ? adhocRows(folders) : shown.map((p) => pjRow(p, words.length)).join("")}</ul>
    ${ids.length ? "" : `<p class="map-empty">${words.length ? "No project matches." : "Nothing here yet."}</p>`}`;
  list.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { PJ.tab = b.dataset.tab; lsSet("valet-pj-tab", PJ.tab); PJ.sel = null; pjRender(); }));
  list.querySelectorAll(".pj-row").forEach((b) => (b.onclick = () => pjSelect(b.dataset.id, false)));
  pjRenderDetail();
}

// One line: its name and worktree count, then what needs you (to clean up, unsaved, open) and when.
function pjRow(p, searching) {
  const infos = p.worktrees.map((w) => wtInfo(p, w));
  const safe = infos.filter((i) => i.safe).length, unsaved = p.worktrees.filter(unsavedWt).length;
  const open = p.worktrees.reduce((n, w) => n + (w.open || 0), 0);
  const bits = [
    searching ? esc(p.context) : "",
    safe ? `<span class="w">${safe} to clean up</span>` : "",
    unsaved ? `<span class="u">${unsaved} unsaved</span>` : "",
    open ? `<span class="o">${open} open</span>` : "",
    !p.cloned ? "not cloned" : p.type === "direct" ? "one folder" : !p.worktrees.length ? "no worktrees" : "",
    p.last_accessed ? short(fromTs(p.last_accessed)) : "",
  ].filter(Boolean);
  const n = p.type === "single" && p.worktrees.length ? p.worktrees.length : "";
  return `<li><button type="button" class="pj-row" data-id="${esc(p.id)}" aria-current="${p.id === PJ.sel}" style="--line:${lineColor(p.id)}"
      title="${esc(p.id)} · ${esc(tilde(p.path))}">
    <span class="bullet"></span><span class="t">${esc(p.label)}</span><span class="c" title="${n ? `${n} worktrees` : ""}">${n}</span>
    <span class="s">${bits.join(" · ")}</span></button></li>`;
}

// The ad-hoc tab: a new ad-hoc session first, then the folders, newest first.
function adhocRows(folders) {
  const row = (id, title, sub, color) => `<li><button type="button" class="pj-row" data-id="${esc(id)}" aria-current="${id === PJ.sel}" style="--line:${color}">
    <span class="bullet"></span><span class="t">${title}</span><span class="c"></span><span class="s">${sub}</span></button></li>`;
  return (ST?.can_launch ? row(ADHOC_NEW, "+ New ad-hoc session", "a dated scratch folder, no git", "var(--accent)") : "")
    + folders.map((a) => row("adhoc:" + a.path, esc(a.name), [
      `${a.files} file${a.files === 1 ? "" : "s"}`, a.open ? `<span class="o">${a.open} open</span>` : "",
      a.parked ? `${a.parked} parked` : "", a.last_accessed ? short(fromTs(a.last_accessed)) : ""].filter(Boolean).join(" · "), "var(--rule-strong)")).join("");
}

function pjSelect(id, focus) {
  PJ.sel = narrow.matches && PJ.sel === id ? null : id;
  PJ.editing = null; PJ.removing = null;
  PJ.launch = PJ.sel === ADHOC_NEW ? { id: ADHOC_NEW, prompt: "" } : null;
  if (PJ.sel === ADHOC_NEW) NS = { ctx: ADHOC, id: "", wt: "", touched: false };
  $("pj-list").querySelectorAll(".pj-row").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === PJ.sel)));
  pjRenderDetail();
  if (focus) $("pj-list").querySelector(`.pj-row[data-id="${CSS.escape(id)}"]`)?.focus();
}

function pjRenderDetail() {
  const list = $("pj-list"), p = PJ.data?.projects.find((x) => x.id === PJ.sel);
  const folder = PJ.sel?.startsWith("adhoc:") && PJ.data?.adhoc.find((a) => "adhoc:" + a.path === PJ.sel);
  if (list.contains(PJD)) list.after(PJD);
  PJD.hidden = !p && !folder && PJ.sel !== ADHOC_NEW;
  if (PJD.hidden) { PJD.innerHTML = ""; return; }
  if (narrow.matches) list.querySelector(`.pj-row[data-id="${CSS.escape(PJ.sel)}"]`)?.parentElement.append(PJD);
  if (!p) { adhocDetail(folder); return; }
  PJD.dataset.id = p.id;
  PJD.style.setProperty("--line", lineColor(p.id));
  const team = p.source === "team", infos = p.worktrees.map((w) => wtInfo(p, w));
  const nSafe = infos.filter((i) => i.safe).length;
  const main = p.type === "direct" ? p.worktrees[0] : null;
  const facts = [
    `<span><b>${p.type === "direct" ? "One folder" : p.type === "single" ? "A worktree per branch" : esc(p.type)}</b></span>`,
    `<span class="path">${esc(tilde(p.path))}</span>`,
    p.owner ? `<span>github.com/${esc(p.owner)}</span>` : `<span>no GitHub owner</span>`,
    p.base ? `<span>base ${esc(p.base)}</span>` : "",
  ].join("");
  let body;
  if (PJ.launch?.id === p.id) {
    body = lfHtml(p);
  } else if (!p.cloned) {
    body = `<p class="empty-line">Not cloned yet: run <code>code</code> once in a terminal to clone it.</p>`;
  } else if (main) {
    const i = wtInfo(p, main);
    body = `<p class="pj-main">Works in its folder, on <b>${esc(main.branch || "its branch")}</b>
      <span class="st-chips">${i.chips.map(([k, t, title]) => `<span class="sc ${k}" title="${esc(title)}">${esc(t)}</span>`).join("")}</span></p>`;
  } else if (!p.worktrees.length) {
    body = `<p class="empty-line">No worktrees yet: New session creates one for a branch.</p>`;
  } else {
    body = `<div class="sect-row pj-wt-h"><h2 class="sect">Worktrees <span class="n">${p.worktrees.length}</span></h2>
        ${nSafe ? `<button class="btn small" type="button" data-pa="clean" title="Review and remove the ones that lose nothing">Clean up ${nSafe}</button>` : ""}</div>
      <ul class="wts">${p.worktrees.map((w, k) => wtRow(p, w, infos[k])).join("")}</ul>`;
  }
  PJD.innerHTML = `
    <div class="sign"><span class="bullet"></span>${esc(p.context)}${team ? `<span class="sub">· team</span>` : ""}</div>
    <h1>${esc(p.label)} <code class="id">${esc(p.id)}</code></h1>
    <div class="facts">${facts}</div>
    <div class="actions">
      ${ST?.can_launch && PJ.launch?.id !== p.id ? `<button class="btn primary" type="button" data-pa="session" ${p.cloned ? "" : "disabled"}>New session</button>` : ""}
      <button class="btn" type="button" data-pa="fetch" ${p.cloned ? "" : "disabled"} title="git fetch --prune: updates merged and deleted branches">Fetch</button>
      <details class="more"><summary class="btn" aria-label="More for ${esc(p.label)}">⋯</summary><div class="menu">
        ${team ? `<button type="button" disabled>Team project<small>It changes by PR to the launcher's config/projects.conf</small></button>`
          : `<button type="button" data-pa="edit">Edit<small>Name, context, kind</small></button><hr>
             <button type="button" data-pa="forget">Remove from the list<small>The folder and its worktrees stay</small></button>`}
      </div></details>
    </div>
    ${PJ.editing === p.id ? pjEditForm(p) : ""}
    <div class="pj-body">${body}</div>
    <p class="note" role="status" aria-live="polite"></p>`;
  lfWire();
}

// The ad-hoc tab's detail: the form for a new ad-hoc session, or a folder and how to make it a project.
function adhocDetail(a) {
  PJD.dataset.id = "";
  PJD.style.setProperty("--line", a ? "var(--rule-strong)" : "var(--accent)");
  PJD.innerHTML = a ? `
    <div class="sign"><span class="bullet"></span>ad-hoc</div>
    <h1>${esc(a.name)}</h1>
    <div class="facts"><span class="path">${esc(tilde(a.path))}</span><span>${a.files} file${a.files === 1 ? "" : "s"}</span>
      ${a.last_accessed ? `<span>used ${ago(fromTs(a.last_accessed))}</span>` : ""}
      ${a.open ? `<span><b>${a.open} open</b></span>` : ""}${a.parked ? `<span>${a.parked} parked</span>` : ""}</div>
    <div class="actions"><button class="btn" type="button" data-pa="promote" ${a.open ? "disabled" : ""}>Make it a project…</button></div>
    <p class="empty-line">${a.open ? "A Claude session is open here: park it first to make it a project." : "Git there, moved to ~/code/&lt;context&gt;/&lt;name&gt;; its conversations and parked cards move with it."}</p>
    <p class="note" role="status" aria-live="polite"></p>`
  : `<div class="sign"><span class="bullet"></span>ad-hoc</div>
    <h1>New ad-hoc session</h1>
    <p class="empty-line">A dated scratch folder, no git, in the launcher's ad-hoc directory. Later it can become a project.</p>
    ${lfHtml(null)}`;
  PJD.querySelector("[data-pa=promote]")?.addEventListener("click", () => { PJ.adhoc = a.path; pjOpenPanel("adhoc"); });
  lfWire();
}

// A worktree: its branch, what git says, when it was last used; Session, and Remove behind ⋯.
function wtRow(p, w, i) {
  const can = w.branch && w.branch !== "(detached)";
  return `<li class="wt" data-path="${esc(w.path)}">
    <span class="br" title="${esc(tilde(w.path))}">${esc(w.branch || "(no branch)")}</span>
    <span class="st-chips">${i.chips.map(([k, t, title]) => `<span class="sc ${k}" title="${esc(title)}">${esc(t)}</span>`).join("")}</span>
    <span class="ago" title="Last session here">${w.last_accessed ? short(fromTs(w.last_accessed)) : ""}</span>
    <span class="acts">
      <button class="btn small" type="button" data-pa="wt-session" ${can ? "" : "disabled"}>Session</button>
      ${i.removable ? `<details class="more"><summary class="btn small" aria-label="More for ${esc(w.branch || "this worktree")}">⋯</summary><div class="menu">
        <button type="button" data-pa="wt-remove">Remove worktree…<small>${i.safe ? "Nothing would be lost" : "Shows what would be lost first"}</small></button></div></details>` : ""}
    </span>
    ${PJ.removing === w.path ? wtConfirm(p, w) : ""}
  </li>`;
}

// ---------------------------------------------- Clean up: every worktree that loses nothing, at once
function pjOpenClean(only) { PJ.clean = { only }; pjRenderClean(); pjRender(); $("pj-clean").scrollIntoView({ block: "nearest" }); }
function pjCloseClean() { PJ.clean = null; pjRenderClean(); pjRender(); }

function pjRenderClean() {
  const form = $("pj-clean");
  form.hidden = !PJ.clean;
  if (!PJ.clean) { form.innerHTML = ""; return; }
  const items = safeList(PJ.clean.only), only = PJ.clean.only && PJ.data.projects.find((p) => p.id === PJ.clean.only);
  const parked = items.reduce((n, x) => n + (x.w.parked || 0), 0);
  form.innerHTML = items.length ? `
    <div class="field wide"><span>Worktrees that lose nothing if removed${only ? ` in ${esc(only.label)}` : ""}
        <small>(no uncommitted or unpushed work; merged, or no commits of their own; no session open)</small></span>
      <div class="picks">${items.map(({ p, w }) => `<label class="pick">
          <input type="checkbox" data-path="${esc(w.path)}" checked>
          <b>${esc(p.label)} · ${esc(w.branch || "(no branch)")}</b>
          <small>${w.status?.merged ? `merged into ${esc(p.base)}` : "no commits of its own"} · ${esc(tilde(w.path))}${w.last_accessed ? ` · used ${ago(fromTs(w.last_accessed))}` : ""}</small>
          <span class="st-chips">${w.parked ? `<span class="sc" title="Its parked cards would no longer resume">${w.parked} parked</span>` : ""}</span></label>`).join("")}</div></div>
    <label class="inline wide"><input type="checkbox" name="branches" checked> Delete their branches too <small>(only the merged ones; the others stay)</small></label>
    ${parked ? `<p class="note wide">${parked} parked card${parked > 1 ? "s" : ""} in these folders would no longer resume.</p>` : ""}
    <div class="ns-acts wide"><button class="btn small danger armed" type="submit">Remove ${items.length} worktree${items.length > 1 ? "s" : ""}</button>
      <button class="btn small" type="button" data-pc="cancel">Cancel</button>
      <span class="note" id="pc-note" role="status" aria-live="polite"></span></div>`
    : `<p class="note wide">Nothing to clean up: every worktree has work of its own.</p>
      <div class="ns-acts wide"><button class="btn small" type="button" data-pc="cancel">Close</button></div>`;
  const go = form.querySelector("[type=submit]");
  const count = () => { const n = form.querySelectorAll("[data-path]:checked").length; if (go) { go.textContent = `Remove ${n} worktree${n === 1 ? "" : "s"}`; go.disabled = !n; } };
  form.querySelectorAll("[data-path]").forEach((c) => (c.onchange = count));
  form.querySelector("[data-pc=cancel]").onclick = pjCloseClean;
  form.onkeydown = (e) => { if (e.key === "Escape") { e.preventDefault(); pjCloseClean(); } };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const paths = [...form.querySelectorAll("[data-path]:checked")].map((c) => c.dataset.path);
    const branches = form.elements.branches.checked, note = $("pc-note");
    go.disabled = true;
    const failed = [];
    let done = 0, nBranches = 0;
    for (const path of paths) {
      note.className = "note"; note.textContent = `Removing ${done + 1} of ${paths.length}…`;
      try { const r = await post("api/project-worktree-remove", { path, delete_branch: branches }); done++; if (r.branch_deleted) nBranches++; }
      catch (err) { failed.push(`${tilde(path)}: ${err.message}`); }
    }
    PJ.clean = null; pjRenderClean();
    const top = $("pj-note");
    top.className = failed.length ? "note bad" : "note";
    top.textContent = `Removed ${done} worktree${done === 1 ? "" : "s"}${nBranches ? ` and ${nBranches} branch${nBranches === 1 ? "" : "es"}` : ""}.${failed.length ? ` Could not remove: ${failed.join("; ")}` : ""}`;
    await pjLoad();
  };
}

function wtConfirm(p, w) {
  const s = w.status || {};
  const lose = [s.dirty ? `${s.dirty} files with uncommitted changes` : "", s.unpushed ? `${s.unpushed} unpushed commits` : "",
    !s.merged && s.ahead > 0 ? `the branch stays: ${s.ahead} commits not in ${p.base}` : ""].filter(Boolean);
  const why = w.open ? "A Claude session is open here: park or close it first."
    : lose.length ? `<b>Careful:</b> ${esc(lose.join("; "))}.`
    : `Nothing is lost: ${s.merged ? `its changes are in ${esc(p.base)}` : "it has no commits of its own"}.`;
  return `<div class="wt-confirm" role="group" aria-label="Remove the worktree of ${esc(w.branch || "")}">
    <span>Removes <code>${esc(tilde(w.path))}</code>. ${why}${w.parked ? ` Its ${w.parked} parked card${w.parked > 1 ? "s" : ""} would no longer resume.` : ""}</span>
    ${w.branch ? `<label><input type="checkbox" data-opt="branch" ${s.merged || s.ahead === 0 ? "checked" : ""}> Delete the branch too <small>(only if merged)</small></label>` : ""}
    ${s.dirty ? `<label><input type="checkbox" data-opt="force"> Discard the uncommitted changes</label>` : ""}
    <button class="btn small danger armed" type="button" data-pa="wt-go" ${w.open ? "disabled" : ""}>Remove worktree</button>
    <button class="btn small" type="button" data-pa="wt-cancel">Cancel</button>
  </div>`;
}

function pjEditForm(p) {
  return `<form class="newsess flat" data-edit="${esc(p.id)}" autocomplete="off">
    <label>Name<input name="label" value="${esc(p.label)}" required></label>
    <label>Context<input name="context" list="pj-ctxs" value="${esc(p.context)}" spellcheck="false" required></label>
    <label>Kind<select name="type">${kindOptions(p.type)}</select></label>
    <div class="ns-acts wide"><button class="btn small primary" type="submit">Save</button>
      <button class="btn small" type="button" data-pa="edit-cancel">Cancel</button></div>
  </form>`;
}

// The launch form for cwd's project (exact: that worktree, not a new branch).
function pjStartSession(cwd, exact) {
  if (PJ.panel) { PJ.panel = null; PJ.done = null; pjRenderPanel(); }
  PJ.pending = { cwd, exact };
  pjApplyPending();
}

async function pjFetch(ids, btn) {
  const note = $("pj-note");
  btn.disabled = true; note.className = "note"; note.textContent = ids.length ? `Fetching ${ids.join(", ")}…` : "Fetching every project… ~10 s";
  try {
    const r = await post("api/project-fetch", { ids });
    note.className = r.failed.length ? "note bad" : "note";
    note.textContent = `Fetched ${r.fetched.length}${r.failed.length ? `; no fetch for ${r.failed.join(", ")} (no origin, or no access)` : ""}.`;
    await pjLoad();
  } catch (e) {
    note.className = "note bad"; note.textContent = e.message;
  }
  btn.disabled = false;
}

PJD.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-pa]");
  if (!b) return;
  const p = PJ.data.projects.find((x) => x.id === PJD.dataset.id);
  const row = b.closest(".wt"), w = row && p.worktrees.find((x) => x.path === row.dataset.path);
  const note = PJD.querySelector(":scope > .note");
  const fail = (err) => { note.className = "note bad"; note.textContent = err.message; b.disabled = false; };
  b.closest("details.more")?.removeAttribute("open");
  switch (b.dataset.pa) {
    case "session": return PJ.launch?.id === p.id ? closeNewPanel() : pjStartSession(p.path, false);
    case "wt-session": return pjStartSession(w.path, true);
    case "fetch": return pjFetch([p.id], b);
    case "clean": return pjOpenClean(p.id);
    case "edit": PJ.editing = PJ.editing === p.id ? null : p.id; pjRenderDetail(); return PJD.querySelector("[data-edit] input")?.focus();
    case "edit-cancel": PJ.editing = null; return pjRenderDetail();
    case "wt-remove": PJ.removing = PJ.removing === w.path ? null : w.path; return pjRenderDetail();
    case "wt-cancel": PJ.removing = null; return pjRenderDetail();
    case "forget":
      if (!arm(b, `Remove ${p.label}? Click again`, note, `It only leaves the list: ${tilde(p.path)} and its worktrees stay.`)) return;
      try { await post("api/project-remove", { id: p.id }); PJ.sel = null; await pjLoad(); } catch (err) { fail(err); }
      return;
    case "wt-go": {
      const opt = (k) => !!row.querySelector(`[data-opt=${k}]`)?.checked;
      if (w.status?.dirty && !opt("force")) { note.className = "note bad"; note.textContent = "It has uncommitted changes: tick “Discard” to remove it anyway."; return; }
      b.disabled = true; note.className = "note"; note.textContent = `Removing ${tilde(w.path)}…`;
      try {
        const r = await post("api/project-worktree-remove", { path: w.path, force: opt("force"), delete_branch: opt("branch") });
        PJ.removing = null;
        await pjLoad();
        const top = $("pj-note");
        top.className = "note";
        top.textContent = `${p.label}: removed the worktree of ${r.branch || "that folder"}${r.branch_deleted ? " and its branch" : r.branch_kept ? "; the branch stays: it has commits that are not merged" : ""}.`;
      } catch (err) { fail(err); }
      return;
    }
  }
});
PJD.addEventListener("submit", async (e) => {
  const form = e.target.closest("[data-edit]");
  if (!form) return;
  e.preventDefault();
  const f = form.elements, note = PJD.querySelector(":scope > .note"), id = form.dataset.edit;
  try {
    await post("api/project-edit", { id, label: f.label.value.trim(), context: f.context.value.trim(), type: f.type.value });
    PJ.editing = null;
    await pjLoad();
  } catch (err) { note.className = "note bad"; note.textContent = err.message; }
});
// The detail moves between the side and the list when the width crosses the breakpoint.
narrow.addEventListener("change", () => { if (VIEW === "projects" && PJ.data) pjRender(); });

// ---------------------------------------------- New project: create, clone, add a folder, from ad-hoc
const PJ_TABS = [["create", "Create new"], ["clone", "Clone from GitHub"], ["add", "Add a folder"], ["adhoc", "From an ad-hoc folder"]];

function pjClosePanel() { PJ.panel = null; PJ.done = null; pjRenderPanel(); pjRender(); }
function pjOpenPanel(tab) { PJ.panel = tab; PJ.done = null; pjRenderPanel(); pjRender(); $("pj-new").querySelector("input:not([type=checkbox]):not([type=radio])")?.focus(); }

// Context, kind and the GitHub row: the same in Create and From ad-hoc.
function pjCommonFields(withGithub) {
  const ctx = lsGet("valet-pj-ctx") || "personal";
  return `<label>Context<input name="context" list="pj-ctxs" value="${esc(ctx)}" spellcheck="false" required></label>
    <label>Kind<select name="type">${kindOptions("single")}</select></label>
    ${withGithub ? `<div class="field wide"><span>GitHub</span><div class="ns-acts">
      <label class="inline"><input type="checkbox" name="gh" checked> Create a repo in</label>
      <input name="owner" value="${esc(pjOwner(ctx))}" aria-label="GitHub owner" placeholder="owner" spellcheck="false" style="width:16ch">
      <select name="vis" aria-label="Visibility" style="width:auto"><option value="private">private</option><option value="public">public</option></select>
    </div></div>` : ""}`;
}

function pjRenderPanel() {
  const form = $("pj-new");
  form.hidden = !PJ.panel;
  if (!PJ.panel) { form.innerHTML = ""; return; }
  const tab = PJ.panel, adhoc = PJ.data?.adhoc || [];
  const tabs = `<div class="field wide"><div class="chips" role="group" aria-label="How">${PJ_TABS.map(([k, l]) =>
    `<button type="button" class="chip" data-tab="${k}" aria-pressed="${k === tab}">${l}${k === "adhoc" && adhoc.length ? ` <small>${adhoc.length}</small>` : ""}</button>`).join("")}</div></div>`;
  let body = "", submit = "";
  if (tab === "create") {
    body = `<label>Name<input name="name" placeholder="e.g. bank-reader: the folder and the repo" spellcheck="false" required></label>
      ${pjCommonFields(true)}
      <details class="wide"><summary>Display name, folder</summary>
        <label>Display name<input name="label" placeholder="the name"></label>
        <label>Folder<input name="path" placeholder="~/code/<context>/<name>" spellcheck="false"></label></details>`;
    submit = "Create project";
  } else if (tab === "clone") {
    body = `<label class="wide">Repository<input name="repo" placeholder="owner/repo, or a git URL" spellcheck="false" required></label>
      ${pjCommonFields(false)}
      <details class="wide"><summary>Display name, id, folder</summary>
        <label>Display name<input name="label" placeholder="the repo's name"></label>
        <label>Id<input name="id" placeholder="from the repo" spellcheck="false"></label>
        <label>Folder<input name="path" placeholder="~/code/<context>/<repo>" spellcheck="false"></label></details>`;
    submit = "Clone";
  } else if (tab === "add") {
    const scan = PJ.scan;
    body = `<div class="field wide"><span>Repos on this machine that are not in the list <small>(~/code and the team's repo folder)</small></span>
        ${scan === null ? `<small>Looking…</small>` : scan.error ? `<small class="bad">${esc(scan.error)}</small>`
          : !scan.repos.length ? `<small>None: every repo found is already a project.</small>`
          : `<div class="picks">${scan.repos.map((x) => `<div class="pick" data-path="${esc(x.path)}">
              <b>${esc(x.name)}</b><small>${esc(tilde(x.path))}${x.owner ? ` · github.com/${esc(x.owner)}` : x.remote ? "" : " · no remote"}${x.last_commit ? ` · last commit ${ago(fromTs(x.last_commit))}` : ""}</small>
              <span class="acts"><button class="btn small" type="button" data-add="${esc(x.path)}">Add to ${esc(x.context)}</button></span></div>`).join("")}</div>`}</div>
      <label class="wide">Or a folder <small>(an existing clone)</small><input name="path" placeholder="~/code/personal/my-repo" spellcheck="false"></label>
      ${pjCommonFields(false)}`;
    submit = "Add folder";
  } else {
    const sel = adhoc.find((a) => a.path === PJ.adhoc);
    body = `<div class="field wide"><span>Ad-hoc folders, newest first <small>(git init there, moved to ~/code/&lt;context&gt;/&lt;name&gt;; its conversations and parked cards move with it)</small></span>
        ${adhoc.length ? `<div class="picks" role="radiogroup">${adhoc.slice(0, 30).map((a) => `<label class="pick${a.open ? " off" : ""}">
            <input type="radio" name="pick" value="${esc(a.path)}" ${a.path === PJ.adhoc ? "checked" : ""}>
            <b>${esc(a.name)}</b><small>${a.files} file${a.files === 1 ? "" : "s"}${a.last_accessed ? ` · ${ago(fromTs(a.last_accessed))}` : ""}</small>
            <span class="st-chips">${a.open ? `<span class="sc live">${a.open} open</span>` : ""}${a.parked ? `<span class="sc">${a.parked} parked</span>` : ""}</span></label>`).join("")}</div>`
          : `<small>No ad-hoc folders.</small>`}</div>
      ${sel ? `<label>Name<input name="name" value="${esc(sel.name.replace(/^\d{4}-\d{2}-\d{2}-?/, "") || "")}" spellcheck="false" required></label>
        ${pjCommonFields(true)}` : ""}`;
    submit = "Make it a project";
  }
  // Done: just what happened and where to go next; "Another one" brings the form back.
  form.innerHTML = PJ.done ? `<div class="done" role="status"><span class="ok">✓</span> ${PJ.done.html}</div>
    <div class="ns-acts wide"><button class="btn small primary" type="button" data-pn="go">Start a session</button>
      <button class="btn small" type="button" data-pn="again">Another one</button>
      <button class="btn small" type="button" data-pn="cancel">Close</button></div>`
    : `${tabs}${body}<p class="preview wide" id="pn-preview"></p>
    <div class="ns-acts wide"><button class="btn small primary" type="submit" ${tab === "adhoc" && !PJ.adhoc ? "disabled" : ""}>${submit}</button>
      <button class="btn small" type="button" data-pn="cancel">Cancel</button>
      <span class="note" id="pn-note" role="status" aria-live="polite"></span></div>`;
  const f = form.elements;
  form.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { PJ.panel = b.dataset.tab; PJ.done = null; pjRenderPanel(); }));
  form.querySelector("[data-pn=cancel]").onclick = pjClosePanel;
  form.querySelector("[data-pn=go]")?.addEventListener("click", () => pjStartSession(PJ.done.path, false));
  form.querySelector("[data-pn=again]")?.addEventListener("click", () => pjOpenPanel(PJ.panel));
  if (PJ.done) { form.querySelector("[data-pn=go]").focus(); return; }
  form.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => pjSubmit(b)));
  form.querySelectorAll("[name=pick]").forEach((r) => (r.onchange = () => { PJ.adhoc = r.value; pjRenderPanel(); }));
  if (f.context) f.context.oninput = () => {
    lsSet("valet-pj-ctx", f.context.value.trim());
    if (f.owner && !f.owner.dataset.touched) f.owner.value = pjOwner(f.context.value.trim());
    pjPreview();
  };
  if (f.owner) f.owner.oninput = () => { f.owner.dataset.touched = "1"; pjPreview(); };
  if (f.gh) f.gh.onchange = () => { f.owner.disabled = f.vis.disabled = !f.gh.checked; pjPreview(); };
  form.oninput = pjPreview;
  form.onkeydown = (e) => { if (e.key === "Escape") { e.preventDefault(); pjClosePanel(); } };
  form.onsubmit = (e) => { e.preventDefault(); pjSubmit(null); };
  if (tab === "add" && PJ.scan === null) pjScan();
  pjPreview();
}

async function pjScan() {
  try {
    const r = await fetch("api/project-scan", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    PJ.scan = { repos: d.repos };
  } catch (e) { PJ.scan = { repos: [], error: e.message }; }
  if (PJ.panel === "add") pjRenderPanel();
}

// What the form is about to do, in one line, as it is filled in.
function pjPreview() {
  const form = $("pj-new"), f = form.elements, out = $("pn-preview");
  if (!out) return;
  const ctx = f.context?.value.trim() || "personal", gh = f.gh?.checked, owner = f.owner?.value.trim();
  const dir = (name) => f.path?.value.trim() || `~/code/${ctx}/${name || "<name>"}`;
  const repo = (name) => gh ? (owner ? `, then <code>github.com/${esc(owner)}/${esc(name || "<name>")}</code> (${f.vis.value})` : `; <b>a GitHub owner is missing</b>`) : ", only local (no GitHub)";
  let html = "";
  if (PJ.panel === "create") {
    const name = f.name.value.trim();
    html = `Creates <code>${esc(dir(name))}</code> with git and a first commit${repo(name)}.`;
  } else if (PJ.panel === "clone") {
    const r = f.repo.value.trim().replace(/\/+$/, "").replace(/\.git$/, "");
    const name = r.split(/[/:]/).pop();
    html = r ? `Clones into <code>${esc(dir(name))}</code>.` : "";
  } else if (PJ.panel === "adhoc" && f.name) {
    const name = f.name.value.trim();
    html = `Moves the folder to <code>${esc(`~/code/${ctx}/${name || "<name>"}`)}</code>, runs git init and commits what it has${repo(name)}.`;
  }
  out.innerHTML = html;
  out.hidden = !html;
}

async function pjSubmit(addBtn) {
  const form = $("pj-new"), f = form.elements, note = $("pn-note"), go = form.querySelector("[type=submit]");
  const bad = (msg, el) => { note.className = "note bad"; note.textContent = msg; el?.focus(); };
  const ctx = f.context?.value.trim() || "personal", type = f.type?.value || "single";
  const gh = { github: f.owner?.value.trim() || "", no_github: f.gh ? !f.gh.checked : true, public: f.vis?.value === "public" };
  let path, body, msg;
  if (addBtn) {
    const x = PJ.scan.repos.find((r) => r.path === addBtn.dataset.add);
    path = "api/project-add"; body = { path: x.path, id: x.id, context: x.context, type: "single" }; msg = `Adding ${x.name}…`;
  } else if (PJ.panel === "create") {
    const name = f.name.value.trim();
    if (!NAME_RE.test(name)) return bad("The name is letters, digits, . _ and - (it is the folder and the repo)", f.name);
    if (!gh.no_github && !gh.github) return bad("Type the GitHub owner, or untick “Create a repo”", f.owner);
    path = "api/project-create"; body = { name, context: ctx, type, label: f.label.value.trim(), path: f.path.value.trim(), ...gh };
    msg = gh.no_github ? "Creating…" : "Creating the folder and the GitHub repo…";
  } else if (PJ.panel === "clone") {
    const repo = f.repo.value.trim();
    if (!repo) return bad("Type owner/repo or a git URL", f.repo);
    path = "api/project-clone"; body = { repo, context: ctx, type, label: f.label.value.trim(), id: f.id.value.trim(), path: f.path.value.trim() };
    msg = "Cloning…";
  } else if (PJ.panel === "add") {
    if (!f.path.value.trim()) return bad("Pick a repo above, or type a folder", f.path);
    path = "api/project-add"; body = { path: f.path.value.trim(), context: ctx, type }; msg = "Adding…";
  } else {
    const a = (PJ.data.adhoc || []).find((x) => x.path === PJ.adhoc);
    if (!a) return bad("Pick an ad-hoc folder");
    if (a.open) return bad("A Claude session is open in that folder: park it first (its card moves with it)");
    const name = f.name.value.trim();
    if (!NAME_RE.test(name)) return bad("The name is letters, digits, . _ and - (it is the folder and the repo)", f.name);
    if (!gh.no_github && !gh.github) return bad("Type the GitHub owner, or untick “Create a repo”", f.owner);
    path = "api/project-promote"; body = { path: a.path, name, context: ctx, type, ...gh }; msg = "Moving the folder and creating the project…";
  }
  go.disabled = true; if (addBtn) addBtn.disabled = true;
  note.className = "note"; note.textContent = msg;
  try {
    const r = await post(path, body);
    PJ.done = { path: r.path, html: `<b>${esc(r.id)}</b> is a project, in <code>${esc(tilde(r.path))}</code>${
      r.github ? ` · <a href="${esc(r.github)}" target="_blank" rel="noopener">${esc(r.github.replace("https://", ""))}</a>` : ""}${
      r.conversations_moved ? ` · ${r.conversations_moved} conversation${r.conversations_moved > 1 ? "s" : ""} moved` : ""}${
      r.warning ? ` <span class="note bad">${esc(r.warning)}</span>` : ""}` };
    PJ.scan = null; PJ.adhoc = null;
    await pjLoad();
    pjRenderPanel();
  } catch (err) {
    go.disabled = false; if (addBtn) addBtn.disabled = false;
    bad(err.message);
  }
}

window.addEventListener("hashchange", showView);

// ------------------------------------------------------------------ load
async function load() {
  if (busy || relaunching) return;
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    ST = await r.json();
    $("who").textContent = ST.user;
    const nParked = ST.parked.filter((c) => !isClosed(c)).length;
    document.title = `herdr-valet · ${nParked} parked`;
    $("n-parked").textContent = nParked;
    $("n-live").textContent = ST.live.length;
    const nAlerts = ST.live.filter((s) => s.stats?.alerts?.length).length;
    $("n-alerts").textContent = nAlerts; $("n-alerts-w").hidden = !nAlerts;
    $("herdr").classList.toggle("down", !ST.herdr_running);
    $("herdr").title = ST.herdr_running ? "herdr is running" : "herdr is not running";
    $("banner").innerHTML = ST.herdr_running ? "" :
      `<div class="banner" role="status">herdr is not running — did the machine reboot? Resume needs it: open the terminal, or press Resume to get a command to run by hand.</div>`;
    keepSelection();
    // A confirmation waiting for its second click would be rebuilt unarmed: leave the rows be.
    if (!$("live").querySelector(".armed")) renderLive();
    renderAllActions();
    if (document.activeElement?.id !== "recent") renderMap();
    renderDetail();
  } catch (e) {
    $("map").innerHTML = `<p class="map-empty err">Could not load: ${esc(e.message)}</p>`;
  }
}

document.addEventListener("click", (e) => {
  for (const d of document.querySelectorAll("details.more[open]")) if (!d.contains(e.target)) d.open = false;
});
document.addEventListener("keydown", (e) => {
  const d = e.key === "Escape" && e.target.closest?.("details.more[open]");
  if (d) { d.open = false; d.querySelector("summary").focus(); e.stopPropagation(); }
}, true);

$("q").addEventListener("input", (e) => {
  if (VIEW === "projects") { PJ.q = e.target.value.trim().toLowerCase(); pjRender(); return; }
  query = e.target.value.trim().toLowerCase();
  keepSelection();
  renderMap(); renderDetail();
});

// Keyboard: "/" searches, ↑/↓ (or j/k) move along the map, Enter resumes, Esc clears search.
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea");
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "Escape" && (typing || query || PJ.q)) { const q = $("q"); q.value = ""; q.dispatchEvent(new Event("input")); q.blur(); return; }
  if (typing || !ST) return;
  if (VIEW === "projects") {
    if (!["ArrowDown", "j", "ArrowUp", "k"].includes(e.key) || !PJ.data) return;
    const ids = [...$("pj-list").querySelectorAll(".pj-row")].map((b) => b.dataset.id);
    const i = ids.indexOf(PJ.sel), step = e.key === "ArrowDown" || e.key === "j" ? 1 : -1;
    const next = ids[i < 0 ? 0 : Math.max(0, Math.min(ids.length - 1, i + step))];
    if (next && next !== PJ.sel) { e.preventDefault(); pjSelect(next, true); }
    return;
  }
  if (["ArrowDown", "j", "ArrowUp", "k"].includes(e.key)) {
    const step = e.key === "ArrowDown" || e.key === "j" ? 1 : -1;
    const next = neighbor(step) ?? (selected ? null : visibleCards()[0]?.session_id);
    if (next) { e.preventDefault(); select(next, true); }
  } else if (e.key === "Enter" && selected && (e.target === document.body || e.target.classList.contains("stop"))) {
    e.preventDefault(); DETAIL.querySelector('[data-act="resume"]')?.click();
  }
});

load();
if (location.hash === "#projects") showView();
// Statuses change while the page sits open next to the terminal: refresh while it's visible.
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
